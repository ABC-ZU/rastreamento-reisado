<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rastreamento do Reisado</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      font-size: 36px;
    }

    select,
    button {
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      font-size: 18px;
    }

    #status {
      margin-top: 25px;
      font-size: 22px;
      font-weight: bold;
    }

    #localizacao {
      margin-top: 20px;
      font-size: 19px;
      line-height: 1.7;
    }

    #informacoes {
      margin-top: 20px;
      padding: 15px;
      background: #f2f2f2;
      border-radius: 10px;
      font-size: 17px;
      line-height: 1.7;
    }
  </style>
</head>

<body>

<h1>🐂 Rastreamento do Reisado</h1>

<p>Escolha o boi que será rastreado:</p>

<select id="boi">
  <option value="boi-estrela">🐂 Boi Estrela</option>
</select>

<button id="botao" onclick="iniciarRastreamento()">
  📍 Iniciar rastreamento
</button>

<div id="status">
  🔴 Rastreamento desligado
</div>

<div id="localizacao"></div>

<div id="informacoes">
  🛰️ Atualizações enviadas: 0
</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>


<script>

const firebaseConfig = {

  apiKey:
  "AIzaSyCXNTSiw5rVRBh9hTKR_bLWzYU72XlpEWQ",

  authDomain:
  "rastreamento-reisado.firebaseapp.com",

  databaseURL:
  "https://rastreamento-reisado-default-rtdb.firebaseio.com",

  projectId:
  "rastreamento-reisado",

  storageBucket:
  "rastreamento-reisado.firebasestorage.app",

  messagingSenderId:
  "796420970266",

  appId:
  "1:796420970266:web:a0f082d40cd1b9410e3ea3"
};


firebase.initializeApp(firebaseConfig);

const database = firebase.database();


let watchId = null;

let contador = 0;

let ultimaLatitude = null;
let ultimaLongitude = null;

let ultimoTempoMovimento = null;

let distanciaTotal = 0;

let velocidadeCalculada = 0;


/*
====================================
INICIAR RASTREAMENTO
====================================
*/

function iniciarRastreamento() {

  const status =
    document.getElementById("status");

  const localizacao =
    document.getElementById("localizacao");

  const informacoes =
    document.getElementById("informacoes");

  const botao =
    document.getElementById("botao");


  if (!navigator.geolocation) {

    status.innerHTML =
      "🔴 GPS não disponível";

    return;
  }


  status.innerHTML =
    "🟡 Procurando sinal GPS...";

  botao.innerHTML =
    "📡 Rastreamento ativo";

  botao.disabled = true;


  if (watchId !== null) {

    navigator.geolocation.clearWatch(watchId);

  }


  watchId = navigator.geolocation.watchPosition(

    receberPosicao,

    erroGPS,

    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 30000
    }

  );

}


/*
====================================
RECEBER GPS
====================================
*/

async function receberPosicao(posicao) {

  const latitude =
    posicao.coords.latitude;

  const longitude =
    posicao.coords.longitude;

  const precisao =
    posicao.coords.accuracy;

  const agora =
    Date.now();


  /*
  IGNORAR GPS MUITO RUIM
  */

  if (precisao > 50) {

    document.getElementById("status")
      .innerHTML =
      "🟡 Aguardando melhor precisão do GPS";

    return;

  }


  /*
  ====================================
  FILTRO DE MOVIMENTO
  ====================================
  */

  let distanciaMovimento = 0;

  let movimentoReal = false;


  if (
    ultimaLatitude !== null &&
    ultimaLongitude !== null
  ) {

    distanciaMovimento =
      calcularDistancia(

        ultimaLatitude,
        ultimaLongitude,

        latitude,
        longitude
      );


    /*
    Quanto pior a precisão,
    maior será o deslocamento necessário.

    mínimo = 5 metros
    */

    const limiteMovimento =
      Math.max(
        5,
        precisao * 2
      );


    if (
      distanciaMovimento >=
      limiteMovimento
    ) {

      movimentoReal = true;

    }

  }


  /*
  ====================================
  VELOCIDADE CALCULADA
  ====================================
  */

  if (
    movimentoReal &&
    ultimoTempoMovimento !== null
  ) {

    const segundos =
      (agora - ultimoTempoMovimento) / 1000;


    if (segundos > 0) {

      velocidadeCalculada =
        (distanciaMovimento / segundos)
        * 3.6;


      /*
      rejeitar salto impossível
      */

      if (velocidadeCalculada > 60) {

        velocidadeCalculada = 0;
        movimentoReal = false;

      }

    }

  }

  else {

    velocidadeCalculada = 0;

  }


  /*
  ====================================
  DISTÂNCIA TOTAL
  ====================================
  */

  if (movimentoReal) {

    distanciaTotal +=
      distanciaMovimento;

  }


  /*
  ====================================
  MOSTRAR NO CELULAR
  ====================================
  */

  document.getElementById("localizacao")
    .innerHTML =

    "Latitude: " +
    latitude.toFixed(7) +

    "<br>Longitude: " +
    longitude.toFixed(7) +

    "<br>Precisão: " +
    Math.round(precisao) +
    " metros" +

    "<br>Velocidade: " +
    velocidadeCalculada.toFixed(1) +
    " km/h" +

    "<br>Distância percorrida: " +
    distanciaTotal.toFixed(1) +
    " metros";


  /*
  ====================================
  POSIÇÃO ATUAL
  ====================================
  */

  const boi =
    document.getElementById("boi").value;


  const dados = {

    nome:
      "Boi Estrela",

    latitude:
      latitude,

    longitude:
      longitude,

    precisao:
      Math.round(precisao),

    velocidade:
      velocidadeCalculada,

    distancia:
      distanciaTotal,

    online:
      true,

    atualizadoEm:
      firebase.database
      .ServerValue
      .TIMESTAMP

  };


  try {

    /*
    Atualiza posição atual
    */

    await database
      .ref("bois/" + boi)
      .update(dados);


    contador++;


    /*
    ====================================
    SALVAR HISTÓRICO
    ====================================
    */

    if (
      movimentoReal ||
      ultimaLatitude === null
    ) {

      const pontoHistorico = {

        latitude:
          latitude,

        longitude:
          longitude,

        precisao:
          Math.round(precisao),

        velocidade:
          velocidadeCalculada,

        distancia:
          distanciaTotal,

        timestamp:
          firebase.database
          .ServerValue
          .TIMESTAMP

      };


      await database
        .ref(
          "historico/" +
          boi
        )
        .push(
          pontoHistorico
        );


      /*
      nova referência
      */

      ultimaLatitude =
        latitude;

      ultimaLongitude =
        longitude;

      ultimoTempoMovimento =
        agora;

    }


    document.getElementById("status")
      .innerHTML =
      "🟢 Boi Estrela sendo rastreado";


    document.getElementById("informacoes")
      .innerHTML =

      "🛰️ Atualizações enviadas: " +
      contador +

      "<br>🕐 Último envio: " +
      new Date()
      .toLocaleTimeString() +

      "<br>" +

      (
        movimentoReal
        ?
        "🚶 Movimento detectado"
        :
        "📍 Posição estável"
      );


  }

  catch (erro) {

    console.error(erro);

    document.getElementById("status")
      .innerHTML =
      "🔴 Erro ao enviar para Firebase";

  }

}


/*
====================================
ERRO GPS
====================================
*/

function erroGPS(erro) {

  console.error(erro);

  const status =
    document.getElementById("status");


  if (erro.code === 1) {

    status.innerHTML =
      "🔴 Permissão de localização negada";

  }

  else if (erro.code === 2) {

    status.innerHTML =
      "🔴 Localização indisponível";

  }

  else if (erro.code === 3) {

    status.innerHTML =
      "🟡 GPS demorou para responder";

  }

}


/*
====================================
DISTÂNCIA ENTRE COORDENADAS
====================================
*/

function calcularDistancia(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R = 6371000;

  const rad =
    Math.PI / 180;


  const dLat =
    (lat2 - lat1) * rad;

  const dLon =
    (lon2 - lon1) * rad;


  const a =

    Math.sin(dLat / 2) *
    Math.sin(dLat / 2)

    +

    Math.cos(lat1 * rad) *
    Math.cos(lat2 * rad) *

    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);


  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );


  return R * c;

}

</script>

</body>
</html>
