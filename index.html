<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Rastreamento do Reisado</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: auto;
      padding: 20px;
      background: #ffffff;
    }

    h1 {
      font-size: 36px;
    }

    select,
    button {
      width: 100%;
      padding: 16px;
      margin-top: 10px;
      font-size: 18px;
    }

    #status {
      margin-top: 25px;
      font-size: 22px;
      font-weight: bold;
    }

    #localizacao {
      font-size: 19px;
      line-height: 1.6;
    }

    .aviso {
      background: #f2f2f2;
      padding: 12px;
      margin-top: 20px;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <h1>🐂 Rastreamento do Reisado</h1>

  <p>Escolha o boi que será rastreado:</p>

  <select id="boi">

    <option value="boi-estrela">
      🐂 Boi Estrela
    </option>

  </select>

  <button id="botao" onclick="iniciarRastreamento()">
    📍 Iniciar rastreamento
  </button>

  <div id="status">
    🔴 Rastreamento desligado
  </div>

  <div id="localizacao"></div>

  <div class="aviso" id="aviso">
    Aguardando início do rastreamento.
  </div>


  <!-- FIREBASE -->

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>


  <script>

    // CONFIGURAÇÃO FIREBASE

    const firebaseConfig = {

      apiKey: "AIzaSyCXNTSiw5rVRBh9hTKR_bLWzYU72XlpEWQ",

      authDomain:
        "rastreamento-reisado.firebaseapp.com",

      databaseURL:
        "https://rastreamento-reisado-default-rtdb.firebaseio.com",

      projectId:
        "rastreamento-reisado",

      storageBucket:
        "rastreamento-reisado.firebasestorage.app",

      messagingSenderId:
        "796420970266",

      appId:
        "1:796420970266:web:a0f082d40cd1b9410e3ea3"

    };


    firebase.initializeApp(firebaseConfig);

    const database = firebase.database();


    let watchId = null;


    function iniciarRastreamento() {

      const status =
        document.getElementById("status");

      const localizacao =
        document.getElementById("localizacao");

      const aviso =
        document.getElementById("aviso");

      const botao =
        document.getElementById("botao");


      if (!navigator.geolocation) {

        status.innerHTML =
          "🔴 GPS não disponível";

        aviso.innerHTML =
          "Este navegador não suporta geolocalização.";

        return;
      }


      status.innerHTML =
        "🟡 Procurando GPS...";

      aviso.innerHTML =
        "Aguarde. Procurando uma localização com boa precisão...";


      // Evita iniciar dois rastreamentos

      if (watchId !== null) {

        navigator.geolocation.clearWatch(watchId);

      }


      watchId =
        navigator.geolocation.watchPosition(

          function(posicao) {

            const latitude =
              posicao.coords.latitude;

            const longitude =
              posicao.coords.longitude;

            const precisao =
              posicao.coords.accuracy;


            localizacao.innerHTML =

              "Latitude: " +
              latitude.toFixed(7) +

              "<br>Longitude: " +
              longitude.toFixed(7) +

              "<br>Precisão: " +
              Math.round(precisao) +
              " metros";


            /*
              IMPORTANTE

              Se a precisão for pior que
              100 metros, NÃO envia
              para o Firebase.
            */

            if (precisao > 100) {

              status.innerHTML =
                "🟡 Aguardando GPS melhorar";

              aviso.innerHTML =
                "Precisão atual: " +
                Math.round(precisao) +
                " metros.<br>" +
                "Aguardando precisão menor que 100 metros.";

              return;

            }


            // BOI SELECIONADO

            const boi =
              document.getElementById("boi").value;


            // NOME DO BOI

            const nome =
              boi === "boi-estrela"
                ? "Boi Estrela"
                : boi;


            /*
              ENVIA PARA FIREBASE
            */

            database
              .ref("bois/" + boi)
              .set({

                nome: nome,

                latitude: latitude,

                longitude: longitude,

                precisao: Math.round(precisao),

                online: true,

                atualizadoEm:
                  firebase.database.ServerValue.TIMESTAMP

              })

              .then(function() {

                status.innerHTML =
                  "🟢 " +
                  nome +
                  " sendo rastreado";

                aviso.innerHTML =
                  "✅ Localização enviada ao mapa.";

                botao.innerHTML =
                  "📡 Rastreamento ativo";

              })

              .catch(function(erro) {

                console.error(erro);

                status.innerHTML =
                  "🔴 Erro ao enviar localização";

                aviso.innerHTML =
                  "Não foi possível enviar os dados ao Firebase.";

              });

          },


          function(erro) {

            console.error(erro);


            status.innerHTML =
              "🔴 Erro ao acessar GPS";


            if (erro.code === 1) {

              aviso.innerHTML =
                "Permissão de localização negada. " +
                "Libere a localização para este site.";

            }

            else if (erro.code === 2) {

              aviso.innerHTML =
                "O celular não conseguiu determinar sua localização.";

            }

            else if (erro.code === 3) {

              aviso.innerHTML =
                "O GPS demorou para responder. Aguarde e tente novamente.";

            }

          },


          {

            enableHighAccuracy: true,

            maximumAge: 0,

            timeout: 20000

          }

        );

    }

  </script>

</body>

</html>
