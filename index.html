<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Rastreamento do Reisado</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      font-size: 36px;
    }

    select,
    button {
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      font-size: 18px;
    }

    #status {
      margin-top: 25px;
      font-size: 22px;
      font-weight: bold;
    }

    #localizacao {
      margin-top: 20px;
      font-size: 19px;
      line-height: 1.7;
    }

    #informacoes {
      margin-top: 20px;
      padding: 15px;
      background: #f2f2f2;
      border-radius: 10px;
      font-size: 17px;
      line-height: 1.7;
    }
  </style>
</head>

<body>

<h1>🐂 Rastreamento do Reisado</h1>

<p>Escolha o boi que será rastreado:</p>

<select id="boi">
  <option value="boi-estrela">🐂 Boi Estrela</option>
</select>

<button id="botao" onclick="iniciarRastreamento()">
  📍 Iniciar rastreamento
</button>

<div id="status">
  🔴 Rastreamento desligado
</div>

<div id="localizacao"></div>

<div id="informacoes">
  🛰️ Atualizações enviadas: 0
  <br>
  🗺️ Pontos salvos no percurso: 0
</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<script>

/* ================================
   FIREBASE
================================ */

const firebaseConfig = {

  apiKey:
    "AIzaSyCXNTSiw5rVRBh9hTKR_bLWzYU72XlpEWQ",

  authDomain:
    "rastreamento-reisado.firebaseapp.com",

  databaseURL:
    "https://rastreamento-reisado-default-rtdb.firebaseio.com",

  projectId:
    "rastreamento-reisado",

  storageBucket:
    "rastreamento-reisado.firebasestorage.app",

  messagingSenderId:
    "796420970266",

  appId:
    "1:796420970266:web:a0f082d40cd1b9410e3ea3"
};


firebase.initializeApp(firebaseConfig);

const database = firebase.database();


/* ================================
   VARIÁVEIS
================================ */

let watchId = null;

let contador = 0;
let contadorHistorico = 0;

let ultimaLatitude = null;
let ultimaLongitude = null;

let ultimoTempo = null;

let distanciaTotal = 0;

let velocidadeCalculada = 0;


/*
Distância mínima para adicionar
um novo ponto ao percurso.
*/

const DISTANCIA_MINIMA = 5;


/*
Precisão máxima aceita.
*/

const PRECISAO_MAXIMA = 50;


/* ================================
   INICIAR RASTREAMENTO
================================ */

function iniciarRastreamento() {

  const status =
    document.getElementById("status");

  const botao =
    document.getElementById("botao");


  if (!navigator.geolocation) {

    status.innerHTML =
      "🔴 GPS não disponível";

    return;
  }


  status.innerHTML =
    "🟡 Procurando sinal GPS...";


  botao.innerHTML =
    "📡 Rastreamento ativo";

  botao.disabled = true;


  if (watchId !== null) {

    navigator.geolocation.clearWatch(
      watchId
    );
  }


  watchId =
    navigator.geolocation.watchPosition(

      receberPosicao,

      erroGPS,

      {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 30000
      }

    );
}


/* ================================
   RECEBER GPS
================================ */

async function receberPosicao(posicao) {

  const latitude =
    posicao.coords.latitude;

  const longitude =
    posicao.coords.longitude;

  const precisao =
    posicao.coords.accuracy;

  const agora =
    Date.now();


  /* ------------------------------
     MOSTRAR GPS ATUAL
  ------------------------------ */

  document.getElementById("localizacao")
    .innerHTML =

    "Latitude: " +
    latitude.toFixed(7) +

    "<br>Longitude: " +
    longitude.toFixed(7) +

    "<br>Precisão: " +
    Math.round(precisao) +
    " metros" +

    "<br>Velocidade: " +
    velocidadeCalculada.toFixed(1) +
    " km/h" +

    "<br>Distância percorrida: " +
    distanciaTotal.toFixed(1) +
    " metros";


  /* ------------------------------
     VERIFICAR PRECISÃO
  ------------------------------ */

  if (precisao > PRECISAO_MAXIMA) {

    document.getElementById("status")
      .innerHTML =

      "🟡 GPS com baixa precisão (" +
      Math.round(precisao) +
      " metros)";

    return;
  }


  /* ------------------------------
     CALCULAR MOVIMENTO
  ------------------------------ */

  let distanciaMovimento = 0;

  let movimentoReal = false;


  if (
    ultimaLatitude !== null &&
    ultimaLongitude !== null
  ) {

    distanciaMovimento =
      calcularDistancia(

        ultimaLatitude,
        ultimaLongitude,

        latitude,
        longitude
      );


    /*
    Além dos 5 metros mínimos,
    consideramos a precisão do GPS.
    */

    const limiteMovimento =
      Math.max(
        DISTANCIA_MINIMA,
        precisao
      );


    if (
      distanciaMovimento >=
      limiteMovimento
    ) {

      movimentoReal = true;
    }
  }


  /* ------------------------------
     PRIMEIRO PONTO
  ------------------------------ */

  const primeiroPonto =
    ultimaLatitude === null;


  /* ------------------------------
     VELOCIDADE CALCULADA
  ------------------------------ */

  velocidadeCalculada = 0;


  if (
    movimentoReal &&
    ultimoTempo !== null
  ) {

    const segundos =
      (agora - ultimoTempo) / 1000;


    if (segundos > 0) {

      velocidadeCalculada =
        (distanciaMovimento / segundos)
        * 3.6;
    }
  }


  /*
  Elimina saltos muito grandes
  considerados incompatíveis
  com o deslocamento do animal.
  */

  if (velocidadeCalculada > 50) {

    movimentoReal = false;

    velocidadeCalculada = 0;
  }


  /* ------------------------------
     DISTÂNCIA TOTAL
  ------------------------------ */

  if (movimentoReal) {

    distanciaTotal +=
      distanciaMovimento;
  }


  /* ------------------------------
     BOI
  ------------------------------ */

  const boi =
    document.getElementById("boi").value;


  /* ------------------------------
     POSIÇÃO ATUAL
  ------------------------------ */

  const dados = {

    nome:
      "Boi Estrela",

    latitude:
      latitude,

    longitude:
      longitude,

    precisao:
      Math.round(precisao),

    velocidade:
      velocidadeCalculada,

    distancia:
      distanciaTotal,

    online:
      true,

    atualizadoEm:
      firebase.database
      .ServerValue
      .TIMESTAMP
  };


  try {

    /*
    Atualiza sempre a posição atual.
    */

    await database
      .ref("bois/" + boi)
      .update(dados);


    contador++;


    /* ------------------------------
       HISTÓRICO
    ------------------------------ */

    if (
      primeiroPonto ||
      movimentoReal
    ) {

      const pontoHistorico = {

        latitude:
          latitude,

        longitude:
          longitude,

        precisao:
          Math.round(precisao),

        velocidade:
          velocidadeCalculada,

        distancia:
          distanciaTotal,

        timestamp:
          firebase.database
          .ServerValue
          .TIMESTAMP
      };


      await database
        .ref("historico/" + boi)
        .push(pontoHistorico);


      contadorHistorico++;


      /*
      Só alteramos a referência do
      percurso quando aceitamos o ponto.
      */

      ultimaLatitude =
        latitude;

      ultimaLongitude =
        longitude;

      ultimoTempo =
        agora;
    }


    /* ------------------------------
       STATUS
    ------------------------------ */

    document.getElementById("status")
      .innerHTML =

      "🟢 Boi Estrela sendo rastreado";


    document.getElementById("informacoes")
      .innerHTML =

      "🛰️ Atualizações enviadas: " +
      contador +

      "<br>🗺️ Pontos salvos no percurso: " +
      contadorHistorico +

      "<br>🕐 Último envio: " +
      new Date().toLocaleTimeString() +

      "<br>" +

      (
        movimentoReal
        ? "🚶 Movimento detectado"
        : "📍 Posição estável"
      );


    /*
    Atualiza novamente os números
    mostrados na tela.
    */

    document.getElementById("localizacao")
      .innerHTML =

      "Latitude: " +
      latitude.toFixed(7) +

      "<br>Longitude: " +
      longitude.toFixed(7) +

      "<br>Precisão: " +
      Math.round(precisao) +
      " metros" +

      "<br>Velocidade: " +
      velocidadeCalculada.toFixed(1) +
      " km/h" +

      "<br>Distância percorrida: " +
      distanciaTotal.toFixed(1) +
      " metros";

  }

  catch (erro) {

    console.error(
      "Erro Firebase:",
      erro
    );


    document.getElementById("status")
      .innerHTML =

      "🔴 Erro ao enviar para Firebase";


    document.getElementById("informacoes")
      .innerHTML =

      "Erro: " +
      erro.message;
  }
}


/* ================================
   ERRO GPS
================================ */

function erroGPS(erro) {

  console.error(
    "Erro GPS:",
    erro
  );


  const status =
    document.getElementById("status");


  if (erro.code === 1) {

    status.innerHTML =
      "🔴 Permissão de localização negada";
  }

  else if (erro.code === 2) {

    status.innerHTML =
      "🔴 Localização indisponível";
  }

  else if (erro.code === 3) {

    status.innerHTML =
      "🟡 GPS demorou para responder";
  }

  else {

    status.innerHTML =
      "🔴 Erro desconhecido no GPS";
  }
}


/* ================================
   DISTÂNCIA ENTRE COORDENADAS
================================ */

function calcularDistancia(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R = 6371000;

  const rad =
    Math.PI / 180;


  const dLat =
    (lat2 - lat1) * rad;

  const dLon =
    (lon2 - lon1) * rad;


  const a =

    Math.sin(dLat / 2) *
    Math.sin(dLat / 2)

    +

    Math.cos(lat1 * rad) *
    Math.cos(lat2 * rad) *

    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);


  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );


  return R * c;
}

</script>

</body>
</html>
