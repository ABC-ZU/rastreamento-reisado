<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rastreamento do Reisado</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      font-size: 36px;
    }

    select,
    button {
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      font-size: 18px;
    }

    #status {
      margin-top: 25px;
      font-size: 22px;
      font-weight: bold;
    }

    #localizacao {
      margin-top: 20px;
      font-size: 19px;
      line-height: 1.7;
    }

    #informacoes {
      margin-top: 20px;
      padding: 15px;
      background: #f2f2f2;
      border-radius: 10px;
      font-size: 17px;
      line-height: 1.7;
    }
  </style>
</head>

<body>

<h1>🐂 Rastreamento do Reisado</h1>

<p>Escolha o boi que será rastreado:</p>

<select id="boi">
  <option value="boi-estrela">🐂 Boi Estrela</option>
</select>

<button id="botao" onclick="iniciarRastreamento()">
  📍 Iniciar rastreamento
</button>

<div id="status">
  🔴 Rastreamento desligado
</div>

<div id="localizacao"></div>

<div id="informacoes">
  🛰️ Atualizações enviadas: 0
  <br>
  🛣️ Pontos gravados: 0
</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<script>

/* =========================================
   CONFIGURAÇÃO FIREBASE
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyCXNTSiw5rVRBh9hTKR_bLWzYU72XlpEWQ",

  authDomain:
    "rastreamento-reisado.firebaseapp.com",

  databaseURL:
    "https://rastreamento-reisado-default-rtdb.firebaseio.com",

  projectId:
    "rastreamento-reisado",

  storageBucket:
    "rastreamento-reisado.firebasestorage.app",

  messagingSenderId:
    "796420970266",

  appId:
    "1:796420970266:web:a0f082d40cd1b9410e3ea3"
};


firebase.initializeApp(firebaseConfig);

const database = firebase.database();


/* =========================================
   VARIÁVEIS
========================================= */

let watchId = null;

let contador = 0;

let pontosGravados = 0;

let ultimaLatitude = null;

let ultimaLongitude = null;

let ultimoTempo = null;

let distanciaTotal = 0;

let velocidadeCalculada = 0;

let primeiroPonto = true;

let enviando = false;


/* =========================================
   INICIAR RASTREAMENTO
========================================= */

function iniciarRastreamento() {

  const status =
    document.getElementById("status");

  const botao =
    document.getElementById("botao");


  if (!navigator.geolocation) {

    status.innerHTML =
      "🔴 GPS não disponível";

    return;
  }


  status.innerHTML =
    "🟡 Procurando sinal GPS...";

  botao.innerHTML =
    "📡 Rastreamento ativo";

  botao.disabled = true;


  /*
  Reinicia os dados desta sessão.
  */

  contador = 0;

  pontosGravados = 0;

  distanciaTotal = 0;

  velocidadeCalculada = 0;

  ultimaLatitude = null;

  ultimaLongitude = null;

  ultimoTempo = null;

  primeiroPonto = true;


  if (watchId !== null) {

    navigator.geolocation.clearWatch(
      watchId
    );
  }


  watchId =
    navigator.geolocation.watchPosition(

      receberPosicao,

      erroGPS,

      {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 30000
      }

    );
}


/* =========================================
   RECEBER POSIÇÃO GPS
========================================= */

async function receberPosicao(posicao) {

  /*
  Evita duas gravações simultâneas.
  */

  if (enviando) {
    return;
  }


  const latitude =
    Number(posicao.coords.latitude);

  const longitude =
    Number(posicao.coords.longitude);

  const precisao =
    Number(posicao.coords.accuracy);

  const agora =
    Date.now();


  /*
  Confere coordenadas.
  */

  if (
    !Number.isFinite(latitude) ||
    !Number.isFinite(longitude) ||
    !Number.isFinite(precisao)
  ) {

    return;
  }


  /*
  =========================================
  FILTRO DE PRECISÃO
  =========================================
  */

  if (precisao > 50) {

    document.getElementById("status")
      .innerHTML =
      "🟡 Aguardando melhor precisão do GPS";

    document.getElementById("localizacao")
      .innerHTML =

      "Latitude: " +
      latitude.toFixed(7) +

      "<br>Longitude: " +
      longitude.toFixed(7) +

      "<br>Precisão: " +
      Math.round(precisao) +
      " metros";

    return;
  }


  let distanciaMovimento = 0;

  let movimentoReal = false;

  let gravarHistorico = false;


  /*
  =========================================
  PRIMEIRO PONTO
  =========================================
  */

  if (primeiroPonto) {

    gravarHistorico = true;

    velocidadeCalculada = 0;

  }


  /*
  =========================================
  DEMAIS PONTOS
  =========================================
  */

  else if (
    ultimaLatitude !== null &&
    ultimaLongitude !== null
  ) {

    distanciaMovimento =
      calcularDistancia(

        ultimaLatitude,
        ultimaLongitude,

        latitude,
        longitude

      );


    /*
    Filtro contra oscilação do GPS.

    Com precisão de 2 m:
    limite = 5 m.

    Com precisão de 4 m:
    limite = 8 m.
    */

    const limiteMovimento =
      Math.max(
        5,
        precisao * 2
      );


    if (
      distanciaMovimento >= limiteMovimento
    ) {

      movimentoReal = true;

    }


    /*
    =========================================
    VELOCIDADE
    =========================================
    */

    if (
      movimentoReal &&
      ultimoTempo !== null
    ) {

      const segundos =
        (agora - ultimoTempo) / 1000;


      if (segundos > 0) {

        velocidadeCalculada =
          (distanciaMovimento / segundos)
          * 3.6;

      }

    }


    /*
    =========================================
    REJEITAR SALTOS DE GPS
    =========================================

    Para o teste do Reisado,
    valores acima de 25 km/h são
    considerados suspeitos.
    */

    if (
      velocidadeCalculada > 25
    ) {

      movimentoReal = false;

      velocidadeCalculada = 0;

      distanciaMovimento = 0;

    }


    /*
    Movimento aceito.
    */

    if (movimentoReal) {

      gravarHistorico = true;

    }

  }


  /*
  Se não houve movimento,
  velocidade exibida fica zero.
  */

  if (!movimentoReal) {

    velocidadeCalculada = 0;

  }


  /*
  =========================================
  DISTÂNCIA TOTAL
  =========================================
  */

  let novaDistanciaTotal =
    distanciaTotal;


  if (
    movimentoReal &&
    gravarHistorico
  ) {

    novaDistanciaTotal +=
      distanciaMovimento;

  }


  /*
  =========================================
  MOSTRAR GPS NO CELULAR
  =========================================
  */

  document.getElementById("localizacao")
    .innerHTML =

    "Latitude: " +
    latitude.toFixed(7) +

    "<br>Longitude: " +
    longitude.toFixed(7) +

    "<br>Precisão: " +
    Math.round(precisao) +
    " metros" +

    "<br>Velocidade: " +
    velocidadeCalculada.toFixed(1) +
    " km/h" +

    "<br>Distância percorrida: " +
    novaDistanciaTotal.toFixed(1) +
    " metros";


  const boi =
    document.getElementById("boi").value;


  /*
  =========================================
  PREPARAR DADOS DA POSIÇÃO ATUAL
  =========================================
  */

  const dadosAtuais = {

    nome:
      "Boi Estrela",

    latitude:
      latitude,

    longitude:
      longitude,

    precisao:
      Math.round(precisao),

    velocidade:
      velocidadeCalculada,

    distancia:
      novaDistanciaTotal,

    online:
      true,

    atualizadoEm:
      firebase.database
      .ServerValue
      .TIMESTAMP

  };


  try {

    enviando = true;


    /*
    =========================================
    ATUALIZAÇÃO ATÔMICA DO FIREBASE
    =========================================

    Atualizamos a posição atual e,
    quando necessário, o histórico
    na mesma operação.
    */

    const atualizacoes = {};


    atualizacoes[
      "bois/" + boi
    ] = dadosAtuais;


    /*
    =========================================
    CRIAR PONTO DO HISTÓRICO
    =========================================
    */

    if (gravarHistorico) {

      const novaChave =
        database
          .ref(
            "historico/" + boi
          )
          .push()
          .key;


      const pontoHistorico = {

        latitude:
          latitude,

        longitude:
          longitude,

        precisao:
          Math.round(precisao),

        velocidade:
          velocidadeCalculada,

        distancia:
          novaDistanciaTotal,

        timestamp:
          firebase.database
          .ServerValue
          .TIMESTAMP

      };


      atualizacoes[
        "historico/" +
        boi +
        "/" +
        novaChave
      ] = pontoHistorico;

    }


    /*
    Uma única gravação.
    */

    await database
      .ref()
      .update(atualizacoes);


    contador++;


    /*
    =========================================
    CONFIRMAR PONTO GRAVADO
    =========================================
    */

    if (gravarHistorico) {

      pontosGravados++;

      distanciaTotal =
        novaDistanciaTotal;


      /*
      A referência somente muda
      depois que o ponto foi aceito.
      */

      ultimaLatitude =
        latitude;

      ultimaLongitude =
        longitude;

      ultimoTempo =
        agora;

      primeiroPonto =
        false;

    }


    document.getElementById("status")
      .innerHTML =
      "🟢 Boi Estrela sendo rastreado";


    document.getElementById("informacoes")
      .innerHTML =

      "🛰️ Atualizações enviadas: " +
      contador +

      "<br>🛣️ Pontos gravados: " +
      pontosGravados +

      "<br>🕐 Último envio: " +
      new Date()
        .toLocaleTimeString() +

      "<br>" +

      (
        primeiroPonto
        ?
        "🛰️ Obtendo primeiro ponto..."
        :
        movimentoReal
        ?
        "🚶 Movimento detectado"
        :
        "📍 Posição estável"
      );


  }

  catch (erro) {

    console.error(
      "ERRO FIREBASE:",
      erro
    );


    document.getElementById("status")
      .innerHTML =
      "🔴 Erro ao enviar para Firebase";


    document.getElementById("informacoes")
      .innerHTML =

      "❌ Erro na gravação.<br>" +

      "Mensagem: " +

      (
        erro.message ||
        "erro desconhecido"
      );

  }

  finally {

    enviando = false;

  }

}


/* =========================================
   ERRO DO GPS
========================================= */

function erroGPS(erro) {

  console.error(
    "ERRO GPS:",
    erro
  );


  const status =
    document.getElementById("status");


  if (erro.code === 1) {

    status.innerHTML =
      "🔴 Permissão de localização negada";

  }

  else if (erro.code === 2) {

    status.innerHTML =
      "🔴 Localização indisponível";

  }

  else if (erro.code === 3) {

    status.innerHTML =
      "🟡 GPS demorou para responder";

  }

  else {

    status.innerHTML =
      "🔴 Erro desconhecido do GPS";

  }

}


/* =========================================
   CALCULAR DISTÂNCIA
========================================= */

function calcularDistancia(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R =
    6371000;

  const rad =
    Math.PI / 180;


  const dLat =
    (lat2 - lat1) * rad;

  const dLon =
    (lon2 - lon1) * rad;


  const a =

    Math.sin(dLat / 2) *
    Math.sin(dLat / 2)

    +

    Math.cos(lat1 * rad) *
    Math.cos(lat2 * rad) *

    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);


  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );


  return R * c;

}

</script>

</body>
</html>
