
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda dos Bois - Reisado de Boa Hora</title>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #edf2f9;
  color: #263348;
}

header {
  background: linear-gradient(135deg, #073c80, #1765af);
  color: white;
  text-align: center;
  padding: 30px 16px;
  border-bottom: 5px solid #c52931;
}

header h1 {
  margin: 0 0 8px;
  font-size: 28px;
}

header p {
  margin: 0;
  font-size: 15px;
}

.container {
  max-width: 800px;
  margin: auto;
  padding: 18px;
}

.introducao {
  text-align: center;
  padding: 8px 8px 18px;
}

.introducao h2 {
  color: #104b91;
  font-size: 24px;
}

.introducao p {
  line-height: 1.6;
  color: #596579;
}

.card {
  background: white;
  border-radius: 17px;
  padding: 18px;
  margin-bottom: 16px;
  display: flex;
  gap: 17px;
  align-items: flex-start;
  border-left: 6px solid #c52931;
  box-shadow: 0 4px 15px rgba(16,75,145,.11);
}

.imagem-boi {
  width: 100px;
  height: 100px;
  object-fit: cover;
  border-radius: 50%;
  border: 3px solid #d4a73b;
  flex-shrink: 0;
}

.dados {
  flex: 1;
  min-width: 0;
}

.dados h3 {
  color: #104b91;
  font-size: 21px;
  margin: 0 0 8px;
}

.dados p {
  margin: 7px 0;
  font-size: 14px;
  line-height: 1.55;
  overflow-wrap: anywhere;
}

.etiqueta {
  display: inline-block;
  background: #eaf4ec;
  color: #24743b;
  border-radius: 20px;
  padding: 5px 10px;
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 7px;
}

.pendente {
  background: #fff3df;
  color: #98620b;
}

.demonstracao {
  background: #f2f2f2;
  color: #777;
}

.apresentacao {
  border-top: 1px solid #e5e9f0;
  padding-top: 11px;
  margin-top: 11px;
}

.apresentacao:first-of-type {
  margin-top: 7px;
}

.data {
  color: #b5222b;
  font-weight: bold;
}

.aviso {
  background: white;
  padding: 18px;
  border-radius: 12px;
  text-align: center;
  margin-bottom: 15px;
}

.botoes {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  margin: 28px 0;
}

.botao {
  display: inline-block;
  padding: 14px 19px;
  background: #104b91;
  color: white;
  text-decoration: none;
  border-radius: 10px;
  font-weight: bold;
  text-align: center;
}

.vermelho {
  background: #c52931;
}

footer {
  text-align: center;
  padding: 18px;
  color: #657080;
  font-size: 13px;
}

@media(max-width: 440px) {
  .card { padding: 12px; gap: 11px; }
  .imagem-boi { width: 73px; height: 73px; }
  .dados h3 { font-size: 18px; }
  .dados p { font-size: 13px; }
}
</style>
</head>

<body>

<header>
  <h1>🐂 Agenda dos Bois</h1>
  <p>Reisado de Boa Hora – Piauí</p>
</header>

<div class="container">

  <section class="introducao">
    <h2>Agenda de Apresentações</h2>
    <p>
      Conheça os bois do Reisado e acompanhe
      suas próximas apresentações, datas,
      horários e comunidades.
    </p>
  </section>

  <div id="status" class="aviso">
    Carregando agenda...
  </div>

  <div id="listaAgenda"></div>

  <div class="botoes">
    <a class="botao" href="./inicio.html">
      🏠 Página inicial
    </a>

    <a class="botao vermelho" href="./mapa.html">
      📍 Localizar os bois
    </a>
  </div>

</div>

<footer>
  Reisado de Boa Hora – PI
  <p>Preservando nossa cultura e tradição.</p>
</footer>

<script>

// CONFIGURAÇÃO DO FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyCXNTSiw5rVRBh9hTKR_bLWzYU72XlpEWQ",
  authDomain: "rastreamento-reisado.firebaseapp.com",
  databaseURL: "https://rastreamento-reisado-default-rtdb.firebaseio.com",
  projectId: "rastreamento-reisado",
  storageBucket: "rastreamento-reisado.firebasestorage.app",
  messagingSenderId: "796420970266",
  appId: "1:796420970266:web:a0f082d40cd1b9410e3ea3"
};

firebase.initializeApp(firebaseConfig);

const database = firebase.database();
const agendaRef = database.ref("agendas");

const lista = document.getElementById("listaAgenda");
const status = document.getElementById("status");

// TODOS OS 11 BOIS
const bois = [
  { nome: "Boi Estrela", responsavel: "Fábio Silva", demo: false },
  { nome: "Boi Caridade", responsavel: "A definir", demo: true },
  { nome: "Boi Ramalhete", responsavel: "A definir", demo: true },
  { nome: "Boi Soberano", responsavel: "A definir", demo: true },
  { nome: "Boi Mimoso", responsavel: "A definir", demo: true },
  { nome: "Boi Luar", responsavel: "A definir", demo: true },
  { nome: "Boi Bugarim", responsavel: "A definir", demo: true },
  { nome: "Boi Encantado", responsavel: "A definir", demo: true },
  { nome: "Boi Flor do Sertão", responsavel: "A definir", demo: true },
  { nome: "Boi Diamante", responsavel: "A definir", demo: true },
  { nome: "Boi Esperança", responsavel: "A definir", demo: true }
];

function formatarData(data) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(data || "")) {
    return "A definir";
  }

  const partes = data.split("-");
  return `${partes[2]}/${partes[1]}/${partes[0]}`;
}

function formatarHora(hora) {
  return /^\d{2}:\d{2}$/.test(hora || "")
    ? hora.replace(":", "h")
    : "A definir";
}

function dataHoje() {
  const hoje = new Date();

  return [
    hoje.getFullYear(),
    String(hoje.getMonth() + 1).padStart(2, "0"),
    String(hoje.getDate()).padStart(2, "0")
  ].join("-");
}

function criarTexto(tag, texto, classe) {
  const elemento = document.createElement(tag);
  elemento.textContent = texto;

  if (classe) {
    elemento.className = classe;
  }

  return elemento;
}

function adicionarInformacao(destino, rotulo, valor, classe) {
  const p = document.createElement("p");

  if (classe) {
    p.className = classe;
  }

  const forte = document.createElement("strong");
  forte.textContent = rotulo;

  p.appendChild(forte);
  p.appendChild(document.createTextNode(" " + valor));

  destino.appendChild(p);
}

function criarCartao(boi, apresentacoes) {

  const card = document.createElement("article");
  card.className = "card";

  const imagem = document.createElement("img");
  imagem.src = "./icone-boi-reisado.png";
  imagem.alt = "Imagem do Reisado";
  imagem.className = "imagem-boi";

  const dados = document.createElement("div");
  dados.className = "dados";

  dados.appendChild(criarTexto("h3", boi.nome));

  adicionarInformacao(
    dados,
    "👤 Responsável:",
    boi.responsavel
  );

  if (apresentacoes.length === 0) {

    dados.appendChild(
      criarTexto(
        "span",
        "Agenda a definir",
        "etiqueta pendente"
      )
    );

    adicionarInformacao(dados, "📅 Data:", "A definir");
    adicionarInformacao(dados, "🕒 Horário:", "A definir");
    adicionarInformacao(dados, "📍 Comunidade:", "A definir");

  } else {

    dados.appendChild(
      criarTexto(
        "span",
        apresentacoes.length === 1
          ? "1 apresentação programada"
          : apresentacoes.length + " apresentações programadas",
        "etiqueta"
      )
    );

    apresentacoes.forEach(function(item) {

      const bloco = document.createElement("div");
      bloco.className = "apresentacao";

      adicionarInformacao(
        bloco,
        "📅 Data:",
        formatarData(item.data),
        "data"
      );

      adicionarInformacao(
        bloco,
        "🕒 Horário:",
        formatarHora(item.horario)
      );

      adicionarInformacao(
        bloco,
        "📍 Comunidade:",
        item.comunidade || "A definir"
      );

      dados.appendChild(bloco);

    });
  }

  if (boi.demo && apresentacoes.length === 0) {
    dados.appendChild(
      criarTexto(
        "span",
        "BOI DE DEMONSTRAÇÃO",
        "etiqueta demonstracao"
      )
    );
  }

  card.appendChild(imagem);
  card.appendChild(dados);

  return card;
}

// ATUALIZAÇÃO AUTOMÁTICA DA AGENDA
agendaRef.on("value", function(snapshot) {

  const todas = [];

  snapshot.forEach(function(registro) {
    const item = registro.val();

    if (
      item &&
      typeof item === "object" &&
      typeof item.boi === "string" &&
      typeof item.data === "string" &&
      /^\d{4}-\d{2}-\d{2}$/.test(item.data)
    ) {
      todas.push(item);
    }
  });

  const hoje = dataHoje();

  // SOMENTE APRESENTAÇÕES DE HOJE EM DIANTE
  const proximas = todas.filter(function(item) {
    return item.data >= hoje;
  });

  // ORDEM DE DATA E HORÁRIO
  proximas.sort(function(a, b) {
    const valorA = a.data + " " + (a.horario || "");
    const valorB = b.data + " " + (b.horario || "");

    return valorA.localeCompare(valorB);
  });

  // BOIS COM APRESENTAÇÃO MAIS PRÓXIMA PRIMEIRO
  const grupos = bois.map(function(boi) {

    const eventos = proximas.filter(function(item) {
      return item.boi === boi.nome;
    });

    return {
      boi: boi,
      eventos: eventos
    };
  });

  grupos.sort(function(a, b) {

    if (a.eventos.length === 0 && b.eventos.length > 0) {
      return 1;
    }

    if (a.eventos.length > 0 && b.eventos.length === 0) {
      return -1;
    }

    if (a.eventos.length === 0 && b.eventos.length === 0) {
      return bois.indexOf(a.boi) - bois.indexOf(b.boi);
    }

    const primeiroA =
      a.eventos[0].data + " " +
      (a.eventos[0].horario || "");

    const primeiroB =
      b.eventos[0].data + " " +
      (b.eventos[0].horario || "");

    return primeiroA.localeCompare(primeiroB);
  });

  lista.innerHTML = "";

  grupos.forEach(function(grupo) {
    lista.appendChild(
      criarCartao(grupo.boi, grupo.eventos)
    );
  });

  status.style.display = "none";

}, function(erro) {

  console.error("Erro ao carregar agenda:", erro);

  status.textContent =
    "Não foi possível carregar a agenda. Tente novamente mais tarde.";

  status.style.display = "block";

  lista.innerHTML = "";
});

</script>
</body>
</html>
