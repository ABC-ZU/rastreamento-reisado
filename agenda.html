
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Agenda dos Bois - Reisado de Boa Hora</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      color: #222;
    }

    .container {
      max-width: 650px;
      min-height: 100vh;
      margin: auto;
      background: #fff;
    }

    header {
      background: linear-gradient(
        135deg,
        #0b3974,
        #1262b8
      );
      color: white;
      text-align: center;
      padding: 32px 20px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 29px;
    }

    header p {
      margin: 0;
      font-size: 15px;
    }

    main {
      padding: 22px 18px;
    }

    .introducao {
      text-align: center;
      font-size: 15px;
      line-height: 1.5;
      color: #555;
      margin: 0 0 24px;
    }

    .boi-card {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      background: white;
      border: 1px solid #e1e5eb;
      border-left: 5px solid #104b91;
      border-radius: 14px;
      padding: 17px;
      margin-bottom: 15px;
      box-shadow: 0 3px 10px #0000000d;
    }

    .boi-card.demo {
      border-left-color: #d49b00;
    }

    .boi-imagem {
      width: 75px;
      height: 75px;
      min-width: 75px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #c52228;
    }

    .demo .boi-imagem {
      border-color: #d49b00;
    }

    .boi-info {
      flex: 1;
      min-width: 0;
    }

    .boi-info h2 {
      margin: 0 0 9px;
      color: #104b91;
      font-size: 20px;
    }

    .boi-info p {
      margin: 5px 0;
      font-size: 14px;
      line-height: 1.5;
    }

    .etiqueta {
      display: inline-block;
      background: #fff2c7;
      color: #765000;
      padding: 4px 8px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .acoes {
      text-align: center;
      padding: 10px 18px 28px;
    }

    .botao {
      display: inline-block;
      text-decoration: none;
      background: #104b91;
      color: white;
      font-weight: bold;
      padding: 14px 20px;
      border-radius: 12px;
      margin: 5px;
    }

    .botao.mapa {
      background: #c52228;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 15px;
      font-size: 13px;
    }

    @media (max-width: 420px) {
      .boi-card {
        gap: 12px;
        padding: 13px;
      }

      .boi-imagem {
        width: 60px;
        height: 60px;
        min-width: 60px;
      }

      .boi-info h2 {
        font-size: 18px;
      }

      .boi-info p {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>📅 Agenda dos Bois</h1>
    <p>Reisado de Boa Hora - Piauí</p>
  </header>

    <p class="introducao">
      Consulte as datas, horários e comunidades
      das apresentações dos bois de Reisado.
    </p>

    <div id="lista-bois"></div>

  </main>

  <div class="acoes">
    <a class="botao" href="./inicio.html">
      ⬅ Voltar ao início
    </a>

    <a class="botao mapa" href="./mapa.html">
      📍 Ver monitoramento
    </a>
  </div>

  <footer>
    Reisado de Boa Hora - PI<br>
    Cultura • Fé • Tradição
  </footer>

</div>

    },
    {

    },

  // EVITA INSERIR TEXOS COMO HTML
  function escaparHTML(texto) {
    return String(texto).replace(
      /[&<>"']/g,
      function(c) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[c];
      }
    );
  }

  // MOSTRA OS CARDS NA TELA
  function carregarAgenda() {

    const lista = document.getElementById("lista-bois");

    lista.innerHTML = "";

    bois.forEach(function(boi) {

      const card = document.createElement("div");

      card.className = "boi-card" +
        (boi.demonstracao ? " demo" : "");

      const etiqueta = boi.demonstracao
        ? '<span class="etiqueta">BOI FICTÍCIO - TESTE</span>'
        : "";

      card.innerHTML = `
        <img
          class="boi-imagem"
          src="${imagemBoi}"
          alt="Boi de Reisado"
        >

        <div class="boi-info">

          ${etiqueta}

          <h2>${escaparHTML(boi.nome)}</h2>

          <p>
            <b>Responsável:</b>
            ${escaparHTML(boi.responsavel)}
          </p>

          <p>
            <b>📅 Data:</b>
            ${escaparHTML(boi.data)}
          </p>

          <p>
            <b>🕒 Horário:</b>
            ${escaparHTML(boi.horario)}
          </p>

          <p>
            <b>📍 Comunidade:</b>
            ${escaparHTML(boi.comunidade)}
          </p>

        </div>
      `;

      lista.appendChild(card);

    });
  }

  carregarAgenda();

</script>

</body>
</html>
