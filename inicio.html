
<!-- ORGANIZAR A SEÇÃO HISTÓRICA NA HOMEPAGE -->

<script>
document.addEventListener("DOMContentLoaded", function () {

  // Localizar a seção histórica
  const historia = document.querySelector(".historia");

  // Localizar a seção dos cards culturais
  const cultura = document.querySelector(".cultura");

  if (historia && cultura) {

    // Encontrar a seção completa dos cards culturais
    const secaoCultural = cultura.closest(".secao");

    if (secaoCultural) {

      // Colocar a história antes dos cards culturais
      secaoCultural.parentNode.insertBefore(
        historia,
        secaoCultural
      );

      console.log(
        "Seção histórica reposicionada com sucesso!"
      );

    }

  }

});
</script>
