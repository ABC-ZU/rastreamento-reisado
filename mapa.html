
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reisado de Boa Hora - Mapa</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
    }

    header {
      background: #104b91;
      color: white;
      text-align: center;
      padding: 18px 12px;
    }

    header h1 {
      font-size: 24px;
      margin: 0 0 6px;
    }

    header p {
      font-size: 14px;
      margin: 0;
    }

    #map {
      width: 100%;
      height: calc(100dvh - 175px);
      min-height: 350px;
    }

    .boi-icon {
      background: #fff;
      border: 3px solid #c52228;
      border-radius: 50%;
      width: 52px;
      height: 52px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 29px;
      box-shadow: 0 3px 10px #0005;
    }

    .acoes {
      background: white;
      text-align: center;
      padding: 14px;
    }

    .agenda {
      display: inline-block;
      background: #c52228;
      color: white;
      text-decoration: none;
      padding: 13px 24px;
      border-radius: 12px;
      font-weight: bold;
    }

    #mensagem {
      margin: 10px 0 0;
      font-size: 13px;
      color: #555;
    }

    .popup-titulo {
      font-weight: bold;
      font-size: 17px;
    }

    .popup-texto {
      line-height: 1.6;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <h1>🐂 Reisado de Boa Hora - PI</h1>
  <p>Toque no boi para acompanhar sua localização</p>
</header>

<div id="map"></div>

<div class="acoes">
  <a class="agenda" href="./agenda.html">
    📅 Agenda das apresentações
  </a>
  <p id="mensagem">Buscando localização dos bois...</p>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCXNTSiw5rVRBh9hTKR_bLWzYU72XlpEWQ",
    authDomain: "rastreamento-reisado.firebaseapp.com",
    databaseURL: "https://rastreamento-reisado-default-rtdb.firebaseio.com",
    projectId: "rastreamento-reisado",
    storageBucket: "rastreamento-reisado.firebasestorage.app",
    messagingSenderId: "796420970266",
    appId: "1:796420970266:web:a0f082d40cd1b9410e3ea3"
  };

  firebase.initializeApp(firebaseConfig);

  const database = firebase.database();

  const map = L.map("map").setView(
    [-4.3074, -42.0363], 14
  );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }
  ).addTo(map);

  const iconeBoi = L.divIcon({
    className: "",
    html: '<div class="boi-icon">🐂</div>',
    iconSize: [52, 52],
    iconAnchor: [26, 26],
    popupAnchor: [0, -25]
  });

  // Bois cadastrados para acompanhamento
  const bois = {
    "boi-estrela": {
      nome: "Boi Estrela",
      responsavel: "Fábio Silva"
    }
  };

  const marcadores = {};
  let primeiroBoi = true;

  const mensagem = document.getElementById("mensagem");

  function acompanharBoi(id, dados) {
    const latitude = Number(dados.latitude);
    const longitude = Number(dados.longitude);

    if (
      dados.latitude == null ||
      dados.longitude == null ||
      !Number.isFinite(latitude) ||
      !Number.isFinite(longitude) ||
      Math.abs(latitude) > 90 ||
      Math.abs(longitude) > 180
    ) {
      return;
    }

    const posicao = [latitude, longitude];
    const cadastro = bois[id];

    const atualizadoEm = Number(dados.atualizadoEm);
    let situacao = "Horário não informado";

    if (Number.isFinite(atualizadoEm) && atualizadoEm > 0) {
      const horarioMs = atualizadoEm < 1e11
        ? atualizadoEm * 1000
        : atualizadoEm;

      const idade = Date.now() - horarioMs;

      if (idade >= 0 && idade <= 120000) {
        situacao = "🟢 Localização recente";
      } else {
        situacao = "🟠 Última localização registrada";
      }

      situacao += "<br>Atualizado: " +
        new Date(horarioMs).toLocaleString("pt-BR");
    }

    const conteudo = `
      <div class="popup-texto">
        <div class="popup-titulo">🐂 ${cadastro.nome}</div>
        Responsável: ${cadastro.responsavel}<br>
        ${situacao}
      </div>
    `;

    if (!marcadores[id]) {
      marcadores[id] = L.marker(posicao, {
        icon: iconeBoi
      }).addTo(map);

      marcadores[id].bindPopup(conteudo);
    } else {
      marcadores[id].setLatLng(posicao);
      marcadores[id].setPopupContent(conteudo);
    }

    mensagem.textContent =
      "Toque no ícone do boi para ver as informações.";

    if (primeiroBoi) {
      map.setView(posicao, 17);
      primeiroBoi = false;
    }
  }

  // Recebe as posições sem modificar o GPS
  Object.keys(bois).forEach(function(id) {
    database.ref("bois/" + id).on(
      "value",
      function(snapshot) {
        const dados = snapshot.val();

        if (dados) {
          acompanharBoi(id, dados);
        } else if (!Object.keys(marcadores).length) {
          mensagem.textContent =
            "Aguardando a primeira localização.";
        }
      },
      function(erro) {
        mensagem.textContent =
          "Não foi possível consultar as localizações.";
        console.error(erro);
      }
    );
  });
</script>

</body>
</html>
