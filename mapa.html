<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Mapa - Boi Estrela</title>


<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>


<style>

body {

  font-family: Arial, sans-serif;

  margin: 0;

  padding: 20px;

  background: white;

}


.container {

  max-width: 1100px;

  margin: auto;

}


h1 {

  font-size: 36px;

}


#status {

  font-size: 24px;

  font-weight: bold;

  margin-bottom: 15px;

}


.info {

  font-size: 20px;

  margin: 9px 0;

}


#map {

  width: 100%;

  height: 600px;

  margin-top: 25px;

  border-radius: 20px;

  overflow: hidden;

}


@media(max-width:600px) {

  body {

    padding: 15px;

  }


  h1 {

    font-size: 32px;

  }


  .info {

    font-size: 18px;

  }


  #map {

    height: 600px;

  }

}

</style>

</head>


<body>


<div class="container">


<h1>🐂 Boi Estrela</h1>


<div id="status">

🟡 Aguardando localização...

</div>


<div class="info">

📍 Precisão:
<strong id="precisao">--</strong>

</div>


<div class="info">

🚶 Velocidade:
<strong id="velocidade">--</strong>

</div>


<div class="info">

📏 Distância percorrida:
<strong id="distancia">--</strong>

</div>


<div class="info">

⏱️ Última atualização:
<strong id="tempo">--</strong>

</div>


<div class="info">

🛰️ Atualizações recebidas:
<strong id="contador">0</strong>

</div>


<div class="info">

🛣️ Pontos do percurso:
<strong id="pontos">0</strong>

</div>


<div id="map"></div>


</div>


<script>


/*
=========================================
FIREBASE
=========================================
*/


const firebaseConfig = {

apiKey:
"AIzaSyCXNTSiw5rVRBh9hTKR_bLWzYU72XlpEWQ",

authDomain:
"rastreamento-reisado.firebaseapp.com",

databaseURL:
"https://rastreamento-reisado-default-rtdb.firebaseio.com",

projectId:
"rastreamento-reisado",

storageBucket:
"rastreamento-reisado.firebasestorage.app",

messagingSenderId:
"796420970266",

appId:
"1:796420970266:web:a0f082d40cd1b9410e3ea3"

};


firebase.initializeApp(firebaseConfig);


const database =
firebase.database();



/*
=========================================
MAPA
=========================================
*/


const map = L.map("map")
.setView(
  [-4.3074, -42.0363],
  16
);


L.tileLayer(

"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

{

  maxZoom: 19,

  attribution:
  "&copy; OpenStreetMap"

}

).addTo(map);



/*
=========================================
VARIÁVEIS
=========================================
*/


let marcador = null;

let circuloPrecisao = null;

let contador = 0;

let primeiraLocalizacao = true;

let ultimoAtualizadoEm = 0;


/*
LINHA DO PERCURSO
*/


const linhaPercurso =
L.polyline(
  [],
  {
    color: "blue",
    weight: 5,
    opacity: 0.8
  }
).addTo(map);



/*
=========================================
REFERÊNCIAS FIREBASE
=========================================
*/


const boiRef =
database.ref(
  "bois/boi-estrela"
);


const historicoRef =
database.ref(
  "historico/boi-estrela"
);



/*
=========================================
POSIÇÃO ATUAL
=========================================
*/


boiRef.on(
"value",
function(snapshot) {


  const dados =
    snapshot.val();


  if (!dados) {

    document.getElementById("status")
      .innerHTML =
      "🔴 Nenhuma localização recebida";

    return;

  }


  const latitude =
    Number(dados.latitude);


  const longitude =
    Number(dados.longitude);


  const precisao =
    Number(dados.precisao || 0);


  const velocidade =
    Number(dados.velocidade || 0);


  const distancia =
    Number(dados.distancia || 0);


  const atualizadoEm =
    Number(dados.atualizadoEm || 0);


  if (
    !Number.isFinite(latitude) ||
    !Number.isFinite(longitude)
  ) {

    return;

  }


  ultimoAtualizadoEm =
    atualizadoEm;


  contador++;


  document.getElementById("contador")
    .innerText =
    contador;


  document.getElementById("precisao")
    .innerText =
    Math.round(precisao) +
    " metros";


  document.getElementById("velocidade")
    .innerText =
    velocidade.toFixed(1) +
    " km/h";


  document.getElementById("distancia")
    .innerText =
    distancia.toFixed(1) +
    " metros";


  const novaPosicao =
    [
      latitude,
      longitude
    ];


  /*
  MARCADOR
  */


  if (!marcador) {

    marcador =
      L.marker(
        novaPosicao
      )
      .addTo(map);


    marcador
      .bindPopup(
        "🐂 Boi Estrela"
      )
      .openPopup();

  }

  else {

    marcador.setLatLng(
      novaPosicao
    );

  }


  /*
  PRECISÃO
  */


  if (!circuloPrecisao) {

    circuloPrecisao =
      L.circle(
        novaPosicao,
        {
          radius:
          Math.max(
            precisao,
            2
          )
        }
      )
      .addTo(map);

  }

  else {

    circuloPrecisao
      .setLatLng(
        novaPosicao
      );


    circuloPrecisao
      .setRadius(
        Math.max(
          precisao,
          2
        )
      );

  }


  /*
  MAPA SEGUE O BOI
  */


  if (primeiraLocalizacao) {

    map.setView(
      novaPosicao,
      18
    );

    primeiraLocalizacao =
      false;

  }

  else {

    map.panTo(
      novaPosicao,
      {
        animate: true,
        duration: 0.8
      }
    );

  }


  verificarStatus(
    atualizadoEm
  );

});


/*
=========================================
HISTÓRICO DO PERCURSO
=========================================
*/


historicoRef.on(
"value",
function(snapshot) {


  const pontosPercurso = [];


  snapshot.forEach(
    function(child) {


      const ponto =
        child.val();


      const lat =
        Number(
          ponto.latitude
        );


      const lon =
        Number(
          ponto.longitude
        );


      if (
        Number.isFinite(lat) &&
        Number.isFinite(lon)
      ) {

        pontosPercurso.push(
          [
            lat,
            lon
          ]
        );

      }

    }
  );


  /*
  desenhar linha completa
  */


  linhaPercurso
    .setLatLngs(
      pontosPercurso
    );


  document.getElementById("pontos")
    .innerText =
    pontosPercurso.length;

});



/*
=========================================
ONLINE / OFFLINE
=========================================
*/


function verificarStatus(
atualizadoEm
) {


  if (!atualizadoEm) {

    return;

  }


  const segundos =

    Math.floor(

      (
        Date.now() -
        atualizadoEm
      )

      / 1000

    );


  const status =
    document.getElementById(
      "status"
    );


  if (segundos <= 30) {

    status.innerHTML =
      "🟢 Boi Estrela ONLINE";

  }

  else {

    status.innerHTML =
      "🔴 Boi Estrela OFFLINE";

  }


  atualizarTempo(
    atualizadoEm
  );

}



/*
=========================================
TEMPO
=========================================
*/


function atualizarTempo(
atualizadoEm
) {


  const segundos =

    Math.max(

      0,

      Math.floor(

        (
          Date.now() -
          atualizadoEm
        )

        / 1000

      )

    );


  let texto;


  if (segundos < 60) {

    texto =
      "há " +
      segundos +
      " segundos";

  }

  else if (
    segundos < 3600
  ) {

    const minutos =
      Math.floor(
        segundos / 60
      );


    texto =
      "há " +
      minutos +
      " minuto(s)";

  }

  else {

    const horas =
      Math.floor(
        segundos / 3600
      );


    texto =
      "há " +
      horas +
      " hora(s)";

  }


  document.getElementById(
    "tempo"
  ).innerText =
    texto;

}



/*
=========================================
ATUALIZAR RELÓGIO
=========================================
*/


setInterval(
function() {


  if (
    ultimoAtualizadoEm
  ) {

    verificarStatus(
      ultimoAtualizadoEm
    );

  }


},
1000
);


</script>

</body>

</html>
