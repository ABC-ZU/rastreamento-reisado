<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa - Boi Estrela</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    #status {
      font-weight: bold;
      margin-bottom: 5px;
    }

    #informacoes {
      margin-bottom: 15px;
      line-height: 1.6;
    }

    #mapa {
      width: 100%;
      height: 500px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <h1>🐂 Boi Estrela</h1>

  <p id="status">
    🟡 Aguardando localização...
  </p>

  <div id="informacoes">
    📍 Precisão: aguardando...<br>
    🕐 Última atualização: aguardando...
  </div>

  <div id="mapa"></div>

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

  <script>

    const firebaseConfig = {
      apiKey: "AIzaSyCXNTSiw5rVRBh9hTKR_bLWzYU72XlpEWQ",
      authDomain: "rastreamento-reisado.firebaseapp.com",
      databaseURL: "https://rastreamento-reisado-default-rtdb.firebaseio.com",
      projectId: "rastreamento-reisado",
      storageBucket: "rastreamento-reisado.firebasestorage.app",
      messagingSenderId: "796420970266",
      appId: "1:796420970266:web:a0f082d40cd1b9410e3ea3"
    };

    firebase.initializeApp(firebaseConfig);

    const database = firebase.database();

    const mapa = L.map("mapa").setView([-5.0, -42.0], 13);

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        attribution: "&copy; OpenStreetMap"
      }
    ).addTo(mapa);

    let marcador = null;

    database.ref("bois/boi-estrela").on(
      "value",
      function(snapshot) {

        const dados = snapshot.val();

        if (!dados) {

          document.getElementById("status").innerText =
            "🔴 Boi sem localização disponível";

          return;
        }

        const latitude = dados.latitude;
        const longitude = dados.longitude;
        const precisao = dados.precisao || 0;
        const atualizadoEm = dados.atualizadoEm;

        // Calcula quantos segundos se passaram
        const agora = Date.now();
        const diferenca = agora - atualizadoEm;
        const segundos = Math.floor(diferenca / 1000);

        // Considera online se atualizou nos últimos 60 segundos
        if (segundos <= 60) {

          document.getElementById("status").innerText =
            "🟢 Boi Estrela ONLINE";

        } else {

          document.getElementById("status").innerText =
            "🔴 Boi Estrela OFFLINE";

        }

        document.getElementById("informacoes").innerHTML =
          "📍 Precisão: " +
          Math.round(precisao) +
          " metros" +
          "<br>" +
          "🕐 Última atualização: há " +
          segundos +
          " segundos";


        if (marcador) {

          marcador.setLatLng([
            latitude,
            longitude
          ]);

        } else {

          marcador = L.marker([
            latitude,
            longitude
          ])
          .addTo(mapa)
          .bindPopup("🐂 Boi Estrela")
          .openPopup();

        }

        mapa.setView([
          latitude,
          longitude
        ], 16);

      }
    );

  </script>

</body>

</html>
