
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reisado Digital de Boa Hora - Mapa dos Bois</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<link rel="stylesheet"
 href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">

<link rel="stylesheet"
 href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  flex-direction: column;
  background: #f2f5fa;
}

/* CABEÇALHO */

header {
  flex-shrink: 0;
  background: linear-gradient(135deg, #073c80, #1765af);
  color: white;
  text-align: center;
  padding: 12px;
  border-bottom: 5px solid #c52931;
}

header img {
  width: 85px;
  height: 85px;
  object-fit: contain;
  display: block;
  margin: 0 auto 7px;
}

header h1 {
  margin: 0 0 6px;
  font-size: 25px;
}

header p {
  margin: 0;
  font-size: 14px;
}

/* MAPA */

#mapa {
  flex: 1;
  min-height: 0;
  width: 100%;
  z-index: 1;
}

/* MARCADOR DO BOI */

.marcador-boi {
  background: transparent;
  border: none;
}

.icone-boi {
  position: relative;
  width: 52px;
  height: 52px;
  background: white;
  border: 4px solid #d4a000;
  border-radius: 50%;
  box-shadow: 0 3px 10px #0005;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: visible;
}

.icone-boi img {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: white;
  border-radius: 50%;
}

.icone-boi.real {
  border-color: #d62828;
}

/* GPS ATIVO - ONDAS VERDES */

.icone-boi.gps-ativo {
  border-color: #00a651;
  box-shadow:
    0 0 0 2px rgba(0,166,81,.2),
    0 3px 10px #0005;
}

.icone-boi.gps-ativo::before,
.icone-boi.gps-ativo::after {
  content: "";
  position: absolute;
  inset: -4px;
  border: 3px solid #00c853;
  border-radius: 50%;
  pointer-events: none;
  animation: ondaGPS 2.4s ease-out infinite;
}

.icone-boi.gps-ativo::after {
  animation-delay: 1.2s;
}

@keyframes ondaGPS {
  0% {
    transform: scale(1);
    opacity: .9;
  }

  100% {
    transform: scale(2.1);
    opacity: 0;
  }
}

/* AGRUPAMENTO */

.grupo-bois {
  background: rgba(16, 75, 145, 0.22);
  border-radius: 50%;
}

.grupo-bois div {
  width: 46px;
  height: 46px;
  margin: 5px;
  border-radius: 50%;
  background: #104b91;
  border: 3px solid white;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 19px;
  font-weight: bold;
  box-shadow: 0 3px 10px #0005;
}

/* NOME DO BOI */

.nome-boi {
  background: white;
  color: #173b66;
  border: 1px solid #aaa;
  border-radius: 7px;
  padding: 4px 7px;
  font-size: 12px;
  font-weight: bold;
  white-space: nowrap;
}

/* POPUP */

.leaflet-popup-content {
  font-family: Arial, sans-serif;
  min-width: 205px;
  line-height: 1.5;
}

.popup-titulo {
  font-size: 19px;
  color: #104b91;
  font-weight: bold;
  margin-bottom: 8px;
}

.popup-info {
  font-size: 14px;
  margin: 7px 0;
}

.popup-status {
  padding: 9px;
  border-radius: 7px;
  background: #f1f4f8;
  margin: 10px 0;
  font-size: 13px;
}

.popup-rota {
  display: block;
  text-align: center;
  background: #198754;
  color: white !important;
  text-decoration: none;
  padding: 11px;
  border-radius: 8px;
  font-weight: bold;
  margin-top: 10px;
}

/* AVISO */

.aviso-mapa {
  position: absolute;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 900;
  background: white;
  padding: 9px 12px;
  border-radius: 10px;
  box-shadow: 0 2px 12px #0003;
  font-size: 12px;
  text-align: center;
  max-width: 90%;
  pointer-events: none;
}

/* CELULAR */

@media (max-width: 600px) {
  header {
    padding: 9px;
  }

  header img {
    width: 65px;
    height: 65px;
  }

  header h1 {
    font-size: 20px;
  }

  header p {
    font-size: 12px;
  }

  .aviso-mapa {
    bottom: 10px;
    font-size: 11px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .icone-boi.gps-ativo::before,
  .icone-boi.gps-ativo::after {
    animation: none;
    opacity: .4;
  }
}
</style>
</head>

<body>

<header>
  <img
    src="./ícone-boi-reisado-logo.png"
    alt="Logomarca do Reisado de Boa Hora"
  >

  <h1>🐂 Reisado Digital de Boa Hora</h1>
  <p>📍 Encontre seu boi favorito em tempo real</p>
</header>

<div id="mapa"></div>

<div class="aviso-mapa" id="aviso">
  🟢 GPS recente | 🔴 GPS antigo |
  🟡 Demonstração
</div>

<script>

// =====================================
// FIREBASE
// =====================================

const firebaseConfig = {
  apiKey: "AIzaSyCXNTSiw5rVRBh9hTKR_bLWzYU72XlpEWQ",
  authDomain: "rastreamento-reisado.firebaseapp.com",
  databaseURL: "https://rastreamento-reisado-default-rtdb.firebaseio.com",
  projectId: "rastreamento-reisado",
  storageBucket: "rastreamento-reisado.firebasestorage.app",
  messagingSenderId: "796420970266",
  appId: "1:796420970266:web:a0f082d40cd1b9410e3ea3"
};

firebase.initializeApp(firebaseConfig);

const database = firebase.database();

// =====================================
// MAPA
// =====================================

const mapa = L.map("mapa").setView(
  [-4.3074, -42.0363],
  14
);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap"
  }
).addTo(mapa);

// =====================================
// AGRUPAMENTO DOS BOIS
// =====================================

const grupoMarcadores = L.markerClusterGroup({
  showCoverageOnHover: false,
  zoomToBoundsOnClick: true,
  spiderfyOnMaxZoom: true,
  spiderfyOnEveryZoom: false,
  removeOutsideVisibleBounds: false,
  animate: true,
  animateAddingMarkers: false,
  maxClusterRadius: 85,
  spiderfyDistanceMultiplier: 2.2,

  iconCreateFunction: function(cluster) {
    const quantidade = cluster.getChildCount();

    return L.divIcon({
      html: "<div>" + quantidade + "</div>",
      className: "grupo-bois",
      iconSize: [56, 56],
      iconAnchor: [28, 28]
    });
  }
});

mapa.addLayer(grupoMarcadores);

// =====================================
// ÍCONE COM EFEITO GPS
// =====================================

function iconeBoi(real, ativo = false) {
  return L.divIcon({
    className: "marcador-boi",
    html:
      '<div class="icone-boi ' +
      (ativo ? "gps-ativo" : real ? "real" : "") +
      '">' +
      '<img src="./icone-boi-reisado.png" alt="Boi">' +
      '</div>',
    iconSize: [52, 52],
    iconAnchor: [26, 26],
    popupAnchor: [0, -25]
  });
}

// =====================================
// BOIS ORIGINAIS
// =====================================

const boisOriginais = [
  {
    nome: "Boi Estrela",
    dono: "Fábio Silva",
    gpsId: "boi-estrela"
  },
  {
    nome: "Boi Caridade",
    lat: -4.3035,
    lng: -42.0340
  },
  {
    nome: "Boi Ramalhete",
    lat: -4.3050,
    lng: -42.0390
  },
  {
    nome: "Boi Soberano",
    lat: -4.3080,
    lng: -42.0320
  },
  {
    nome: "Boi Mimoso",
    lat: -4.3105,
    lng: -42.0370
  },
  {
    nome: "Boi Luar",
    lat: -4.3065,
    lng: -42.0430
  },
  {
    nome: "Boi Bugarim",
    lat: -4.3120,
    lng: -42.0410
  },
  {
    nome: "Boi Encantado",
    lat: -4.3010,
    lng: -42.0370
  },
  {
    nome: "Boi Flor do Sertão",
    lat: -4.3140,
    lng: -42.0340
  },
  {
    nome: "Boi Diamante",
    lat: -4.3090,
    lng: -42.0460
  },
  {
    nome: "Boi Esperança",
    lat: -4.3000,
    lng: -42.0430
  }
];

// =====================================
// VARIÁVEIS
// =====================================

let cadastros = [];
let localizacoes = {};
let boisAtuais = [];

const marcadores = new Map();

// =====================================
// FUNÇÕES AUXILIARES
// =====================================

function normalizar(texto) {
  return String(texto || "")
    .trim()
    .toLocaleLowerCase("pt-BR");
}

function escapar(texto) {
  return String(texto ?? "").replace(
    /[&<>"']/g,
    caractere => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[caractere])
  );
}

// =====================================
// INTEGRAR CADASTROS DO ADMIN
// =====================================

function montarBois() {
  const usados = new Set();
  const resultado = [];

  boisOriginais.forEach(original => {
    const cadastro = cadastros.find(c =>
      normalizar(c.nomeOriginal) ===
      normalizar(original.nome)
    ) || cadastros.find(c =>
      !c.nomeOriginal &&
      normalizar(c.nome) ===
      normalizar(original.nome)
    );

    if (cadastro) {
      usados.add(cadastro.id);
    }

    resultado.push({
      chave: "original:" + normalizar(original.nome),
      nome: cadastro?.nome || original.nome,
      dono: cadastro?.dono ||
        original.dono || "A definir",
      gpsId: original.gpsId ||
        cadastro?.id || null,
      cadastroId: cadastro?.id || null,
      lat: original.lat,
      lng: original.lng
    });
  });

  cadastros.forEach(cadastro => {
    if (usados.has(cadastro.id)) return;

    resultado.push({
      chave: "cadastro:" + cadastro.id,
      nome: cadastro.nome,
      dono: cadastro.dono,
      gpsId: cadastro.id,
      cadastroId: cadastro.id,
      lat: null,
      lng: null
    });
  });

  boisAtuais = resultado;
}

// =====================================
// LOCALIZAÇÃO
// =====================================

function coordenadasValidas(dados) {
  if (
    !dados ||
    dados.latitude == null ||
    dados.longitude == null
  ) {
    return false;
  }

  const lat = Number(dados.latitude);
  const lng = Number(dados.longitude);

  return Number.isFinite(lat) &&
    Number.isFinite(lng) &&
    Math.abs(lat) <= 90 &&
    Math.abs(lng) <= 180;
}

function localizarBoi(boi) {
  const ids = [
    boi.cadastroId,
    boi.gpsId
  ].filter(Boolean);

  for (const id of ids) {
    const dados = localizacoes[id];

    if (coordenadasValidas(dados)) {
      return {
        latitude: Number(dados.latitude),
        longitude: Number(dados.longitude),
        real: true,
        dados
      };
    }
  }

  if (
    Number.isFinite(boi.lat) &&
    Number.isFinite(boi.lng)
  ) {
    return {
      latitude: boi.lat,
      longitude: boi.lng,
      real: false,
      dados: null
    };
  }

  return null;
}

// =====================================
// HORÁRIO DO GPS
// =====================================

function tempoAtualizacao(dados) {
  const valor = Number(dados?.atualizadoEm);

  if (!Number.isFinite(valor) || valor <= 0) {
    return null;
  }

  return valor < 1e11
    ? valor * 1000
    : valor;
}

function gpsRecente(dados) {
  const tempo = tempoAtualizacao(dados);

  if (!tempo) return false;

  const diferenca = Date.now() - tempo;

  return diferenca >= 0 &&
    diferenca <= 120000;
}

function formatarHorario(dados) {
  const tempo = tempoAtualizacao(dados);

  if (!tempo) return "Não informado";

  return new Date(tempo).toLocaleString("pt-BR");
}

// =====================================
// JANELA DO BOI
// =====================================

function conteudoPopup(boi, posicao) {
  let html =
    '<div class="popup-titulo">🐂 ' +
    escapar(boi.nome) +
    '</div>' +
    '<div class="popup-info">' +
    '👤 Responsável: <b>' +
    escapar(boi.dono) +
    '</b></div>';

  if (!posicao) {
    return html +
      '<div class="popup-status">' +
      '⚪ Sem localização disponível.' +
      '</div>';
  }

  if (!posicao.real) {
    return html +
      '<div class="popup-status">' +
      '🟡 Localização de demonstração.' +
      '<br>Este boi ainda não está transmitindo GPS.' +
      '</div>';
  }

  if (gpsRecente(posicao.dados)) {
    html +=
      '<div class="popup-status">' +
      '🟢 GPS atualizado - localização recente.' +
      '</div>';
  } else {
    html +=
      '<div class="popup-status">' +
      '🔴 GPS desatualizado.' +
      '<br>Última localização conhecida.' +
      '</div>';
  }

  html +=
    '<div class="popup-info">' +
    '🕒 Atualizado em: ' +
    escapar(formatarHorario(posicao.dados)) +
    '</div>';

  const precisao =
    posicao.dados.precisao ??
    posicao.dados.accuracy;

  if (
    precisao != null &&
    Number.isFinite(Number(precisao)) &&
    Number(precisao) > 0
  ) {
    html +=
      '<div class="popup-info">' +
      '🎯 Precisão: ' +
      Math.round(Number(precisao)) +
      ' metros</div>';
  }

  if (gpsRecente(posicao.dados)) {
    const destino =
      posicao.latitude + "," +
      posicao.longitude;

    const url =
      "https://www.google.com/maps/dir/?api=1" +
      "&destination=" +
      encodeURIComponent(destino);

    html +=
      '<a class="popup-rota" ' +
      'href="' + url + '" ' +
      'target="_blank" ' +
      'rel="noopener noreferrer">' +
      '🧭 Como chegar ao boi' +
      '</a>';
  }

  return html;
}

// =====================================
// ATUALIZAR MARCADORES
// =====================================

function atualizarMapa() {
  montarBois();

  const chaves = new Set(
    boisAtuais.map(boi => boi.chave)
  );

  // Retirar marcadores excluídos.
  for (const [chave, marcador] of marcadores) {
    if (!chaves.has(chave)) {
      grupoMarcadores.removeLayer(marcador);
      marcadores.delete(chave);
    }
  }

  boisAtuais.forEach(boi => {
    const posicao = localizarBoi(boi);

    const gpsAtivo =
      posicao?.real === true &&
      gpsRecente(posicao.dados);

    let marcador = marcadores.get(boi.chave);

    if (!posicao) {
      if (marcador) {
        grupoMarcadores.removeLayer(marcador);
        marcadores.delete(boi.chave);
      }
      return;
    }

    const coordenadas = [
      posicao.latitude,
      posicao.longitude
    ];

    if (!marcador) {
      marcador = L.marker(coordenadas, {
        icon: iconeBoi(posicao.real, gpsAtivo),
        title: boi.nome
      });

      marcador.bindPopup("");

      marcador.bindTooltip(boi.nome, {
        permanent: false,
        direction: "top",
        className: "nome-boi"
      });

      grupoMarcadores.addLayer(marcador);
      marcadores.set(boi.chave, marcador);
    } else {
      marcador.setLatLng(coordenadas);

      // Atualiza a cor e as ondas
      // conforme o horário do GPS.
      marcador.setIcon(
        iconeBoi(posicao.real, gpsAtivo)
      );

      marcador.setTooltipContent(boi.nome);
    }

    marcador.setPopupContent(
      conteudoPopup(boi, posicao)
    );
  });

  // Recalcular os agrupamentos após
  // receber novas coordenadas.
  grupoMarcadores.refreshClusters();
}

// =====================================
// LER CADASTROS DO FIREBASE
// =====================================

database.ref("cadastroBois").on(
  "value",
  snapshot => {
    cadastros = [];

    snapshot.forEach(item => {
      const dados = item.val();

      if (
        dados &&
        typeof dados.nome === "string" &&
        dados.nome.trim()
      ) {
        cadastros.push({
          id: item.key,
          nome: dados.nome.trim(),
          dono: String(dados.dono || "A definir"),
          nomeOriginal: String(
            dados.nomeOriginal || ""
          ).trim()
        });
      }
    });

    atualizarMapa();
  },
  erro => {
    console.error("Erro nos cadastros:", erro);

    document.getElementById("aviso").textContent =
      "Não foi possível consultar os cadastros.";
  }
);

// =====================================
// GPS EM TEMPO REAL
// =====================================

database.ref("bois").on(
  "value",
  snapshot => {
    localizacoes = snapshot.val() || {};
    atualizarMapa();
  },
  erro => {
    console.error("Erro no GPS:", erro);

    localizacoes = {};
    atualizarMapa();

    document.getElementById("aviso").textContent =
      "GPS indisponível. Verifique a conexão.";
  }
);

// Verifica se o GPS ainda está recente.
setInterval(atualizarMapa, 30000);

// Mostrar os bois ao abrir.
atualizarMapa();

</script>
</body>
</html>
