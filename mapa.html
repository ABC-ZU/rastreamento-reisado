
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reisado Digital de Boa Hora - Mapa</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  flex-direction: column;
  background: #f2f5fa;
}

header {
  flex-shrink: 0;
  background: linear-gradient(135deg, #073c80, #1765af);
  color: white;
  text-align: center;
  padding: 12px;
  border-bottom: 5px solid #c52931;
}

header img {
  width: 85px;
  height: 85px;
  object-fit: contain;
  display: block;
  margin: 0 auto 7px;
}

header h1 {
  margin: 0 0 6px;
  font-size: 25px;
}

header p {
  margin: 0;
  font-size: 14px;
}

#mapa {
  flex: 1;
  min-height: 0;
  width: 100%;
  z-index: 1;
}

.marcador-boi {
  background: transparent;
  border: none;
}

.icone-boi {
  position: relative;
  width: 52px;
  height: 52px;
  background: white;
  border: 4px solid #d4a000;
  border-radius: 50%;
  box-shadow: 0 3px 10px #0005;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: visible;
}

.icone-boi img {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: white;
  border-radius: 50%;
}

.icone-boi.gps-antigo {
  border-color: #d62828;
}

.icone-boi.gps-ativo {
  border-color: #00a651;
  box-shadow: 0 0 0 2px #00a65133, 0 3px 10px #0005;
}

.icone-boi.gps-ativo::before,
.icone-boi.gps-ativo::after {
  content: "";
  position: absolute;
  inset: -4px;
  border: 3px solid #00c853;
  border-radius: 50%;
  pointer-events: none;
  animation: ondaGPS 2.4s ease-out infinite;
}

.icone-boi.gps-ativo::after {
  animation-delay: 1.2s;
}

@keyframes ondaGPS {
  0% {
    transform: scale(1);
    opacity: .9;
  }
  100% {
    transform: scale(2.1);
    opacity: 0;
  }
}

.grupo-bois {
  background: #104b9138;
  border-radius: 50%;
}

.grupo-bois div {
  width: 46px;
  height: 46px;
  margin: 5px;
  border-radius: 50%;
  background: #104b91;
  border: 3px solid white;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 19px;
  font-weight: bold;
  box-shadow: 0 3px 10px #0005;
}

.nome-boi {
  background: white;
  color: #173b66;
  border: 1px solid #aaa;
  border-radius: 7px;
  padding: 4px 7px;
  font-size: 12px;
  font-weight: bold;
}

.leaflet-popup-content {
  font-family: Arial, sans-serif;
  min-width: 205px;
  line-height: 1.5;
}

.popup-titulo {
  font-size: 19px;
  color: #104b91;
  font-weight: bold;
  margin-bottom: 8px;
}

.popup-info {
  font-size: 14px;
  margin: 7px 0;
}

.popup-status {
  padding: 9px;
  border-radius: 7px;
  background: #f1f4f8;
  margin: 10px 0;
  font-size: 13px;
}

.popup-rota {
  display: block;
  text-align: center;
  background: #198754;
  color: white !important;
  text-decoration: none;
  padding: 11px;
  border-radius: 8px;
  font-weight: bold;
  margin-top: 10px;
}

.aviso-mapa {
  position: absolute;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 900;
  background: white;
  padding: 9px 12px;
  border-radius: 10px;
  box-shadow: 0 2px 12px #0003;
  font-size: 12px;
  text-align: center;
  max-width: 90%;
  pointer-events: none;
}

@media (max-width: 600px) {
  header { padding: 9px; }
  header img { width: 65px; height: 65px; }
  header h1 { font-size: 20px; }
  header p { font-size: 12px; }
  .aviso-mapa { bottom: 10px; font-size: 11px; }
}

@media (prefers-reduced-motion: reduce) {
  .icone-boi.gps-ativo::before,
  .icone-boi.gps-ativo::after {
    animation: none;
    opacity: .4;
  }
}
</style>
</head>

<body>

<header>
  <img src="./ícone-boi-reisado-logo.png"
       alt="Logomarca do Reisado de Boa Hora">
  <h1>🐂 Reisado Digital de Boa Hora</h1>
  <p>📍 Encontre seu boi favorito em tempo real</p>
</header>

<div id="mapa"></div>

<div class="aviso-mapa" id="aviso">
  Carregando bois cadastrados...
</div>

<script>

// ======================================
// FIREBASE
// ======================================

const firebaseConfig = {
  apiKey: "AIzaSyCXNTSiw5rVRBh9hTKR_bLWzYU72XlpEWQ",
  authDomain: "rastreamento-reisado.firebaseapp.com",
  databaseURL: "https://rastreamento-reisado-default-rtdb.firebaseio.com",
  projectId: "rastreamento-reisado",
  storageBucket: "rastreamento-reisado.firebasestorage.app",
  messagingSenderId: "796420970266",
  appId: "1:796420970266:web:a0f082d40cd1b9410e3ea3"
};

firebase.initializeApp(firebaseConfig);

const database = firebase.database();

// ======================================
// MAPA
// ======================================

const mapa = L.map("mapa").setView(
  [-4.3074, -42.0363],
  14
);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap"
  }
).addTo(mapa);

// ======================================
// AGRUPAMENTO
// ======================================

const grupoMarcadores = L.markerClusterGroup({
  showCoverageOnHover: false,
  zoomToBoundsOnClick: true,
  spiderfyOnMaxZoom: true,
  removeOutsideVisibleBounds: false,
  animate: true,
  maxClusterRadius: 85,
  spiderfyDistanceMultiplier: 2.2,

  iconCreateFunction: function(cluster) {
    return L.divIcon({
      html: "<div>" + cluster.getChildCount() + "</div>",
      className: "grupo-bois",
      iconSize: [56, 56],
      iconAnchor: [28, 28]
    });
  }
});

mapa.addLayer(grupoMarcadores);

// ======================================
// POSIÇÕES DE DEMONSTRAÇÃO
// NÃO SÃO COORDENADAS REAIS
// ======================================

const posicoesDemo = {
  "boi caridade": [-4.3035, -42.0340],
  "boi ramalhete": [-4.3050, -42.0390],
  "boi soberano": [-4.3080, -42.0320],
  "boi mimoso": [-4.3105, -42.0370],
  "boi luar": [-4.3065, -42.0430],
  "boi bugarim": [-4.3120, -42.0410],
  "boi encantado": [-4.3010, -42.0370],
  "boi flor do sertão": [-4.3140, -42.0340],
  "boi diamante": [-4.3090, -42.0460],
  "boi esperança": [-4.3000, -42.0430]
};

// ======================================
// DADOS DO SISTEMA
// ======================================

let cadastros = [];
let localizacoes = {};
let cadastrosCarregados = false;
let gpsCarregado = false;

const marcadores = new Map();

// ======================================
// FUNÇÕES AUXILIARES
// ======================================

function normalizar(texto) {
  return String(texto || "")
    .trim()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase();
}

function escapar(texto) {
  return String(texto ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[c])
  );
}

function coordenadasValidas(dados) {
  if (!dados ||
      dados.latitude == null ||
      dados.longitude == null) {
    return false;
  }

  const lat = Number(dados.latitude);
  const lng = Number(dados.longitude);

  return Number.isFinite(lat) &&
         Number.isFinite(lng) &&
         Math.abs(lat) <= 90 &&
         Math.abs(lng) <= 180;
}

function tempoAtualizacao(dados) {
  const valor = Number(dados?.atualizadoEm);

  if (!Number.isFinite(valor) || valor <= 0) {
    return null;
  }

  return valor < 1e11 ? valor * 1000 : valor;
}

function gpsRecente(dados) {
  const tempo = tempoAtualizacao(dados);

  if (!tempo) return false;

  const diferenca = Date.now() - tempo;

  return diferenca >= 0 && diferenca <= 120000;
}

function formatarHorario(dados) {
  const tempo = tempoAtualizacao(dados);

  return tempo
    ? new Date(tempo).toLocaleString("pt-BR")
    : "Não informado";
}

// ======================================
// IDENTIFICAR BOI ESTRELA
// ======================================

function ehBoiEstrela(boi) {
  return normalizar(boi.nomeOriginal) === "boi estrela" ||
         normalizar(boi.nome) === "boi estrela";
}

// ======================================
// LOCALIZAÇÃO DE CADA BOI
// ======================================

function localizarBoi(boi) {

  // Primeiro procura o GPS pelo ID
  // do cadastro no Firebase.
  const ids = [boi.id];

  // Preserva a transmissão antiga
  // que já funciona no Boi Estrela.
  if (ehBoiEstrela(boi)) {
    ids.push("boi-estrela");
  }

  for (const id of ids) {
    const dados = localizacoes[id];

    if (coordenadasValidas(dados)) {
      return {
        latitude: Number(dados.latitude),
        longitude: Number(dados.longitude),
        real: true,
        dados
      };
    }
  }

  // Se ainda não existe GPS, usa
  // posição de demonstração conhecida.
  const nomeReferencia =
    normalizar(boi.nomeOriginal || boi.nome);

  const demo = posicoesDemo[nomeReferencia];

  if (demo) {
    return {
      latitude: demo[0],
      longitude: demo[1],
      real: false,
      dados: null
    };
  }

  // Não inventa coordenadas para
  // cadastros sem GPS ou posição demo.
  return null;
}

// ======================================
// ÍCONE DO BOI
// ======================================

function iconeBoi(posicao) {
  const classe = !posicao.real
    ? ""
    : gpsRecente(posicao.dados)
      ? "gps-ativo"
      : "gps-antigo";

  return L.divIcon({
    className: "marcador-boi",
    html:
      '<div class="icone-boi ' + classe + '">' +
      '<img src="./icone-boi-reisado.png" alt="Boi">' +
      '</div>',
    iconSize: [52, 52],
    iconAnchor: [26, 26],
    popupAnchor: [0, -25]
  });
}

// ======================================
// INFORMAÇÕES DO BOI
// ======================================

function conteudoPopup(boi, posicao) {
  let html =
    '<div class="popup-titulo">🐂 ' +
    escapar(boi.nome) +
    '</div>' +
    '<div class="popup-info">' +
    '👤 Responsável: <b>' +
    escapar(boi.dono || "A definir") +
    '</b></div>';

  if (!posicao.real) {
    return html +
      '<div class="popup-status">' +
      '🟡 Localização de demonstração.' +
      '<br>Este boi ainda não está transmitindo GPS.' +
      '</div>';
  }

  const recente = gpsRecente(posicao.dados);

  html +=
    '<div class="popup-status">' +
    (recente
      ? '🟢 GPS atualizado - localização recente.'
      : '🔴 GPS desatualizado - última posição conhecida.') +
    '</div>';

  html +=
    '<div class="popup-info">' +
    '🕒 Atualizado em: ' +
    escapar(formatarHorario(posicao.dados)) +
    '</div>';

  const precisao =
    posicao.dados.precisao ??
    posicao.dados.accuracy;

  if (precisao != null &&
      Number.isFinite(Number(precisao)) &&
      Number(precisao) > 0) {

    html +=
      '<div class="popup-info">' +
      '🎯 Precisão: ' +
      Math.round(Number(precisao)) +
      ' metros</div>';
  }

  if (recente) {
    const destino =
      posicao.latitude + "," +
      posicao.longitude;

    const url =
      "https://www.google.com/maps/dir/?api=1" +
      "&destination=" +
      encodeURIComponent(destino);

    html +=
      '<a class="popup-rota" ' +
      'href="' + url + '" ' +
      'target="_blank" ' +
      'rel="noopener noreferrer">' +
      '🧭 Como chegar ao boi' +
      '</a>';
  }

  return html;
}

// ======================================
// ATUALIZAR O MAPA
// ======================================

function atualizarMapa() {

  // Não apaga marcadores enquanto
  // os cadastros ainda carregam.
  if (!cadastrosCarregados) return;

  const idsValidos = new Set(
    cadastros.map(boi => boi.id)
  );

  for (const [id, marcador] of marcadores) {
    if (!idsValidos.has(id)) {
      grupoMarcadores.removeLayer(marcador);
      marcadores.delete(id);
    }
  }

  let comPosicao = 0;
  let gpsAtivos = 0;

  cadastros.forEach(boi => {
    const posicao = localizarBoi(boi);
    let marcador = marcadores.get(boi.id);

    if (!posicao) {
      if (marcador) {
        grupoMarcadores.removeLayer(marcador);
        marcadores.delete(boi.id);
      }
      return;
    }

    comPosicao++;

    if (posicao.real && gpsRecente(posicao.dados)) {
      gpsAtivos++;
    }

    const coordenadas = [
      posicao.latitude,
      posicao.longitude
    ];

    if (!marcador) {
      marcador = L.marker(coordenadas, {
        icon: iconeBoi(posicao),
        title: boi.nome
      });

      marcador.bindPopup(
        conteudoPopup(boi, posicao)
      );

      marcador.bindTooltip(boi.nome, {
        permanent: false,
        direction: "top",
        className: "nome-boi"
      });

      grupoMarcadores.addLayer(marcador);
      marcadores.set(boi.id, marcador);

    } else {
      marcador.setLatLng(coordenadas);
      marcador.setIcon(iconeBoi(posicao));
      marcador.setTooltipContent(boi.nome);
      marcador.setPopupContent(
        conteudoPopup(boi, posicao)
      );
    }
  });

  grupoMarcadores.refreshClusters();

  const aviso = document.getElementById("aviso");

  if (!gpsCarregado) {
    aviso.textContent = "Carregando localizações GPS...";
    return;
  }

  const semPosicao = cadastros.length - comPosicao;

  aviso.textContent =
    "🐂 " + cadastros.length + " cadastrados | " +
    "🟢 " + gpsAtivos + " GPS recente(s)" +
    (semPosicao > 0
      ? " | ⚪ " + semPosicao + " sem posição"
      : "") +
    " | 🟡 Demais posições de demonstração ou GPS antigo";
}

// ======================================
// CADASTROS DIRETO DO FIREBASE
// ======================================

database.ref("cadastroBois").on(
  "value",

  snapshot => {
    const lista = [];

    snapshot.forEach(item => {
      const dados = item.val();

      if (!dados ||
          typeof dados.nome !== "string" ||
          !dados.nome.trim()) {
        return;
      }

      lista.push({
        id: item.key,
        nome: dados.nome.trim(),
        dono: String(dados.dono || "A definir"),
        nomeOriginal: String(
          dados.nomeOriginal || ""
        ).trim()
      });
    });

    cadastros = lista;
    cadastrosCarregados = true;

    atualizarMapa();
  },

  erro => {
    console.error("Erro ao ler cadastroBois:", erro);

    document.getElementById("aviso").textContent =
      "Não foi possível carregar os cadastros.";
  }
);

// ======================================
// GPS EM TEMPO REAL
// ======================================

database.ref("bois").on(
  "value",

  snapshot => {
    localizacoes = snapshot.val() || {};
    gpsCarregado = true;

    atualizarMapa();
  },

  erro => {
    console.error("Erro ao ler GPS:", erro);

    gpsCarregado = false;

    document.getElementById("aviso").textContent =
      "GPS indisponível. Verifique a conexão.";
  }
);

// Verifica periodicamente se as
// coordenadas ainda são recentes.
setInterval(atualizarMapa, 30000);

</script>
</body>
</html>
