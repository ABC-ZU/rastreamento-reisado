<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Mapa - Boi Estrela</title>

  <!-- LEAFLET -->
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #ffffff;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 20px;
    }

    #status {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    #precisao {
      font-size: 19px;
      margin-bottom: 8px;
    }

    #atualizacao {
      font-size: 19px;
      margin-bottom: 20px;
    }

    #map {
      width: 100%;
      height: 600px;
      border-radius: 15px;
      overflow: hidden;
    }

    .legenda {
      margin-top: 20px;
      background: #f4f4f4;
      padding: 15px;
      border-radius: 10px;
      font-size: 16px;
    }

    @media (max-width: 600px) {

      body {
        padding: 15px;
      }

      h1 {
        font-size: 34px;
      }

      #status {
        font-size: 20px;
      }

      #map {
        height: 65vh;
      }

    }

  </style>

</head>


<body>

<div class="container">

  <h1>🐂 Boi Estrela</h1>

  <div id="status">
    🟡 Aguardando localização...
  </div>

  <div id="precisao">
    📍 Precisão: aguardando...
  </div>

  <div id="atualizacao">
    🕐 Última atualização: aguardando...
  </div>

  <div id="map"></div>

  <div class="legenda">

    <strong>Status do rastreamento</strong>

    <p>🟢 ONLINE — atualização recente</p>

    <p>🟡 SINAL FRACO — sem atualização entre 2 e 5 minutos</p>

    <p>🔴 OFFLINE — mais de 5 minutos sem atualização</p>

  </div>

</div>


<!-- LEAFLET -->

<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<!-- FIREBASE -->

<script
src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js">
</script>

<script
src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js">
</script>


<script>

  /*
  ============================
  CONFIGURAÇÃO FIREBASE
  ============================
  */

  const firebaseConfig = {

    apiKey:
    "AIzaSyCXNTSiw5rVRBh9hTKR_bLWzYU72XlpEWQ",

    authDomain:
    "rastreamento-reisado.firebaseapp.com",

    databaseURL:
    "https://rastreamento-reisado-default-rtdb.firebaseio.com",

    projectId:
    "rastreamento-reisado",

    storageBucket:
    "rastreamento-reisado.firebasestorage.app",

    messagingSenderId:
    "796420970266",

    appId:
    "1:796420970266:web:a0f082d40cd1b9410e3ea3"

  };


  firebase.initializeApp(firebaseConfig);

  const database = firebase.database();


  /*
  ============================
  CRIAR MAPA
  ============================
  */

  const map = L.map("map").setView(
    [-4.3, -42.0],
    13
  );


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,

      attribution:
      "&copy; OpenStreetMap"
    }
  ).addTo(map);


  /*
  ============================
  VARIÁVEIS
  ============================
  */

  let marcador = null;

  let circuloPrecisao = null;

  let ultimaAtualizacao = 0;

  let primeiraLocalizacao = true;


  /*
  ============================
  FIREBASE EM TEMPO REAL
  ============================
  */

  const referencia =
    database.ref("bois/boi-estrela");


  referencia.on("value", function(snapshot) {

    const dados = snapshot.val();


    if (!dados) {

      document.getElementById("status").innerHTML =
        "🔴 Nenhuma localização disponível";

      return;

    }


    const latitude =
      Number(dados.latitude);

    const longitude =
      Number(dados.longitude);

    const precisao =
      Number(dados.precisao || 0);

    ultimaAtualizacao =
      Number(dados.atualizadoEm || 0);


    /*
    ============================
    MOSTRAR PRECISÃO
    ============================
    */

    document.getElementById("precisao").innerHTML =
      "📍 Precisão: " +
      Math.round(precisao) +
      " metros";


    /*
    ============================
    MARCADOR
    ============================
    */

    if (marcador === null) {

      marcador =
        L.marker([
          latitude,
          longitude
        ])
        .addTo(map);

      marcador
        .bindPopup("🐂 Boi Estrela")
        .openPopup();

    }

    else {

      marcador.setLatLng([
        latitude,
        longitude
      ]);

    }


    /*
    ============================
    CÍRCULO DA PRECISÃO
    ============================
    */

    if (circuloPrecisao === null) {

      circuloPrecisao =
        L.circle(
          [latitude, longitude],
          {
            radius: precisao
          }
        ).addTo(map);

    }

    else {

      circuloPrecisao.setLatLng([
        latitude,
        longitude
      ]);

      circuloPrecisao.setRadius(
        precisao
      );

    }


    /*
    ============================
    CENTRALIZAR MAPA
    ============================
    */

    if (primeiraLocalizacao) {

      map.setView(
        [latitude, longitude],
        17
      );

      primeiraLocalizacao = false;

    }

    else {

      map.panTo([
        latitude,
        longitude
      ]);

    }


    atualizarStatus();

  });


  /*
  ============================
  STATUS ONLINE
  ============================
  */

  function atualizarStatus() {

    if (!ultimaAtualizacao) {
      return;
    }


    const agora = Date.now();

    const diferenca =
      agora - ultimaAtualizacao;


    const segundos =
      Math.floor(
        diferenca / 1000
      );


    /*
    ONLINE
    menos de 2 minutos
    */

    if (segundos < 120) {

      document.getElementById("status").innerHTML =
        "🟢 Boi Estrela ONLINE";

    }


    /*
    SINAL FRACO
    entre 2 e 5 minutos
    */

    else if (segundos < 300) {

      document.getElementById("status").innerHTML =
        "🟡 Boi Estrela - SINAL FRACO";

    }


    /*
    OFFLINE
    mais de 5 minutos
    */

    else {

      document.getElementById("status").innerHTML =
        "🔴 Boi Estrela OFFLINE";

    }


    /*
    ============================
    TEMPO DA ÚLTIMA ATUALIZAÇÃO
    ============================
    */

    let textoTempo = "";


    if (segundos < 60) {

      textoTempo =
        "há " +
        segundos +
        " segundos";

    }

    else if (segundos < 3600) {

      const minutos =
        Math.floor(segundos / 60);

      textoTempo =
        "há " +
        minutos +
        (minutos === 1
          ? " minuto"
          : " minutos");

    }

    else if (segundos < 86400) {

      const horas =
        Math.floor(segundos / 3600);

      textoTempo =
        "há " +
        horas +
        (horas === 1
          ? " hora"
          : " horas");

    }

    else {

      const dias =
        Math.floor(segundos / 86400);

      textoTempo =
        "há " +
        dias +
        (dias === 1
          ? " dia"
          : " dias");

    }


    document.getElementById(
      "atualizacao"
    ).innerHTML =

      "🕐 Última atualização: " +
      textoTempo;

  }


  /*
  Atualiza o contador
  automaticamente
  */

  setInterval(
    atualizarStatus,
    1000
  );


</script>

</body>
</html>
