<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mapa - Boi Estrela</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #ffffff;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 20px;
    }

    #status {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .info {
      font-size: 20px;
      margin: 8px 0;
    }

    #map {
      width: 100%;
      height: 600px;
      margin-top: 25px;
      border-radius: 20px;
      overflow: hidden;
    }

    @media (max-width: 600px) {

      body {
        padding: 15px;
      }

      h1 {
        font-size: 32px;
      }

      #status {
        font-size: 22px;
      }

      .info {
        font-size: 19px;
      }

      #map {
        height: 600px;
      }

    }

  </style>

</head>

<body>

<div class="container">

  <h1>🐂 Boi Estrela</h1>

  <div id="status">
    🟡 Aguardando localização...
  </div>

  <div class="info">
    📍 Precisão:
    <span id="precisao">--</span>
  </div>

  <div class="info">
    🚶 Velocidade:
    <span id="velocidade">--</span>
  </div>

  <div class="info">
    ⏱️ Última atualização:
    <span id="tempo">--</span>
  </div>

  <div class="info">
    🛰️ Atualizações recebidas:
    <span id="contador">0</span>
  </div>

  <div id="map"></div>

</div>


<script>

const firebaseConfig = {

  apiKey: "AIzaSyCXNTSiw5rVRBh9hTKR_bLWzYU72XlpEWQ",

  authDomain:
    "rastreamento-reisado.firebaseapp.com",

  databaseURL:
    "https://rastreamento-reisado-default-rtdb.firebaseio.com",

  projectId:
    "rastreamento-reisado",

  storageBucket:
    "rastreamento-reisado.firebasestorage.app",

  messagingSenderId:
    "796420970266",

  appId:
    "1:796420970266:web:a0f082d40cd1b9410e3ea3"

};


// Inicializar Firebase

firebase.initializeApp(firebaseConfig);

const database = firebase.database();


// MAPA

const map = L.map("map").setView(
  [-4.3074, -42.0363],
  15
);


// OpenStreetMap

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {

    maxZoom: 19,

    attribution:
      '&copy; OpenStreetMap'

  }
).addTo(map);


// Marcador

let marcador = null;


// Círculo de precisão

let circuloPrecisao = null;


// Linha do percurso

let linhaPercurso = L.polyline([], {

  color: "blue",

  weight: 5,

  opacity: 0.8

}).addTo(map);


// Array que guarda o percurso

let percurso = [];


// contador

let contador = 0;


// Primeira localização

let primeiraLocalizacao = true;


// Referência Firebase

const boiRef =
  database.ref("bois/boi-estrela");


// ESCUTAR FIREBASE EM TEMPO REAL

boiRef.on("value", function(snapshot) {

  const dados = snapshot.val();

  if (!dados) {

    document.getElementById("status").innerHTML =
      "🔴 Nenhuma localização recebida";

    return;

  }


  const latitude =
    Number(dados.latitude);

  const longitude =
    Number(dados.longitude);

  const precisao =
    Number(dados.precisao || 0);

  const velocidade =
    Number(dados.velocidade || 0);

  const atualizadoEm =
    Number(dados.atualizadoEm || 0);


  // Verificação

  if (
    !Number.isFinite(latitude) ||
    !Number.isFinite(longitude)
  ) {

    return;

  }


  const novaPosicao = [
    latitude,
    longitude
  ];


  contador++;


  document.getElementById("contador")
    .innerText = contador;


  // PRECISÃO

  document.getElementById("precisao")
    .innerText =
      Math.round(precisao) + " metros";


  // VELOCIDADE

  document.getElementById("velocidade")
    .innerText =
      velocidade.toFixed(1) + " km/h";


  // MARCADOR

  if (!marcador) {

    marcador = L.marker(
      novaPosicao
    ).addTo(map);

    marcador.bindPopup(
      "🐂 Boi Estrela"
    ).openPopup();

  } else {

    marcador.setLatLng(
      novaPosicao
    );

  }


  // CÍRCULO DE PRECISÃO

  if (!circuloPrecisao) {

    circuloPrecisao = L.circle(
      novaPosicao,
      {
        radius: precisao
      }
    ).addTo(map);

  } else {

    circuloPrecisao.setLatLng(
      novaPosicao
    );

    circuloPrecisao.setRadius(
      precisao
    );

  }


  // GUARDAR POSIÇÃO NO PERCURSO

  percurso.push(
    novaPosicao
  );


  // limitar memória

  if (percurso.length > 500) {

    percurso.shift();

  }


  // atualizar linha

  linhaPercurso.setLatLngs(
    percurso
  );


  // MOVER MAPA JUNTO COM O BOI

  if (primeiraLocalizacao) {

    map.setView(
      novaPosicao,
      18
    );

    primeiraLocalizacao = false;

  } else {

    map.panTo(
      novaPosicao,
      {
        animate: true,
        duration: 1
      }
    );

  }


  // VERIFICAR ONLINE/OFFLINE

  verificarStatus(
    atualizadoEm
  );

});


// STATUS ONLINE / OFFLINE

function verificarStatus(atualizadoEm) {

  if (!atualizadoEm) {
    return;
  }


  const agora =
    Date.now();


  const diferenca =
    agora - atualizadoEm;


  const segundos =
    Math.floor(
      diferenca / 1000
    );


  const status =
    document.getElementById("status");


  // menos de 30 segundos

  if (segundos <= 30) {

    status.innerHTML =
      "🟢 Boi Estrela ONLINE";

  }

  else {

    status.innerHTML =
      "🔴 Boi Estrela OFFLINE";

  }


  atualizarTempo(
    atualizadoEm
  );

}


// TEMPO DA ÚLTIMA ATUALIZAÇÃO

function atualizarTempo(atualizadoEm) {

  const agora =
    Date.now();


  const segundos =
    Math.floor(
      (agora - atualizadoEm) / 1000
    );


  let texto;


  if (segundos < 60) {

    texto =
      "há " +
      segundos +
      " segundos";

  }

  else if (segundos < 3600) {

    const minutos =
      Math.floor(
        segundos / 60
      );

    texto =
      "há " +
      minutos +
      " minuto(s)";

  }

  else {

    const horas =
      Math.floor(
        segundos / 3600
      );

    texto =
      "há " +
      horas +
      " hora(s)";

  }


  document.getElementById("tempo")
    .innerText = texto;

}


// atualizar relógio

setInterval(function() {

  boiRef.once("value")
    .then(function(snapshot) {

      const dados =
        snapshot.val();

      if (
        dados &&
        dados.atualizadoEm
      ) {

        verificarStatus(
          Number(
            dados.atualizadoEm
          )
        );

      }

    });

}, 5000);


</script>

</body>

</html>
