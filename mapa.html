
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mapa dos Bois - Boa Hora PI</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f5fa;
}

header {
  background: #104b91;
  color: white;
  padding: 20px 12px;
  text-align: center;
  border-bottom: 4px solid #c52228;
}

header h1 { margin: 0 0 6px; font-size: 24px; }
header p { margin: 0; font-size: 14px; }

#map {
  height: 65vh;
  min-height: 360px;
  width: 100%;
}

.boi-icon {
  width: 56px;
  height: 56px;
  background: white;
  border: 3px solid #c52228;
  border-radius: 50%;
  overflow: hidden;
  box-shadow: 0 3px 10px #0005;
}

.boi-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.boi-demo {
  border-color: #d49b00;
  background: #fff3b0;
}

.nome-mapa {
  background: white;
  border: 1px solid #aaa;
  border-radius: 7px;
  padding: 3px 7px;
  font-weight: bold;
  font-size: 12px;
  white-space: nowrap;
}

.popup {
  min-width: 200px;
  line-height: 1.6;
  font-size: 14px;
}

.popup strong {
  color: #104b91;
  font-size: 17px;
}

.local {
  background: #edf2fa;
  padding: 8px;
  border-radius: 8px;
  margin-top: 8px;
}

.demo-aviso {
  color: #8a5900;
  font-weight: bold;
}

.acoes {
  text-align: center;
  background: white;
  padding: 15px;
}

.agenda {
  display: inline-block;
  padding: 12px 22px;
  background: #c52228;
  color: white;
  border-radius: 10px;
  text-decoration: none;
  font-weight: bold;
}

#mensagem {
  font-size: 13px;
  color: #555;
}

.cadastros {
  max-width: 900px;
  margin: 20px auto;
  padding: 18px;
  background: white;
  border-radius: 15px;
  box-shadow: 0 3px 12px #0001;
}

.cadastros h2 {
  color: #104b91;
  margin-top: 0;
}

.cadastros > p {
  color: #555;
  font-size: 14px;
}

.lista-bois {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 12px;
}

.ficha-boi {
  background: #f5f8fc;
  border-left: 4px solid #104b91;
  border-radius: 10px;
  padding: 14px;
}

.ficha-boi strong {
  display: block;
  color: #104b91;
  font-size: 17px;
  margin-bottom: 7px;
}

.ficha-boi span {
  display: block;
  font-size: 14px;
  margin-top: 5px;
}

.ficha-boi small {
  display: block;
  margin-top: 8px;
  color: #666;
}
</style>
</head>

<body>

<header>
  <h1>🐂 Monitoramento dos Bois</h1>
  <p>Reisado de Boa Hora - Piauí</p>
</header>

<div id="map"></div>

<div class="acoes">
  <a class="agenda" href="./agenda.html">
    📅 Agenda dos Bois
  </a>

  <p id="mensagem">
    🟡 Amarelo: demonstração.
    🔴 Vermelho: GPS real.
  </p>
</div>

<section class="cadastros">
  <h2>🐂 Bois cadastrados</h2>
  <p>
    Nomes e responsáveis atualizados
    automaticamente pelo painel administrativo.
  </p>

  <div id="listaBois" class="lista-bois">
    Carregando cadastros...
  </div>
</section>

<script>

// FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyCXNTSiw5rVRBh9hTKR_bLWzYU72XlpEWQ",
  authDomain: "rastreamento-reisado.firebaseapp.com",
  databaseURL: "https://rastreamento-reisado-default-rtdb.firebaseio.com",
  projectId: "rastreamento-reisado",
  storageBucket: "rastreamento-reisado.firebasestorage.app",
  messagingSenderId: "796420970266",
  appId: "1:796420970266:web:a0f082d40cd1b9410e3ea3"
};

firebase.initializeApp(firebaseConfig);

const database = firebase.database();

// MAPA
const map = L.map("map").setView(
  [-4.3074, -42.0363], 14
);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap"
  }
).addTo(map);

const imagemBoi = "./icone-boi-reisado.png";

function criarIcone(demo) {
  return L.divIcon({
    className: "",
    html:
      '<div class="boi-icon ' +
      (demo ? "boi-demo" : "") +
      '">' +
      '<img src="' + imagemBoi + '" alt="Boi">' +
      '</div>',
    iconSize: [56, 56],
    iconAnchor: [28, 28],
    popupAnchor: [0, -28]
  });
}

const iconeReal = criarIcone(false);
const iconeDemo = criarIcone(true);

function escaparHTML(texto) {
  return String(texto ?? "").replace(
    /[&<>"']/g,
    function(c) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[c];
    }
  );
}

function normalizar(nome) {
  return String(nome || "")
    .trim()
    .toLocaleLowerCase("pt-BR");
}

// MARCADORES DE DEMONSTRAÇÃO
const boisDemo = [
  { nome: "Boi Caridade", lat: -4.3035, lng: -42.0340 },
  { nome: "Boi Ramalhete", lat: -4.3050, lng: -42.0390 },
  { nome: "Boi Soberano", lat: -4.3080, lng: -42.0320 },
  { nome: "Boi Mimoso", lat: -4.3105, lng: -42.0370 },
  { nome: "Boi Luar", lat: -4.3065, lng: -42.0430 },
  { nome: "Boi Bugarim", lat: -4.3120, lng: -42.0410 },
  { nome: "Boi Encantado", lat: -4.3010, lng: -42.0370 },
  { nome: "Boi Flor do Sertão", lat: -4.3140, lng: -42.0340 },
  { nome: "Boi Diamante", lat: -4.3090, lng: -42.0460 },
  { nome: "Boi Esperança", lat: -4.3000, lng: -42.0430 }
];

let cadastroBois = [];
const marcadoresDemo = new Map();

let marcadorEstrela = null;
let circuloPrecisao = null;
let primeiraLocalizacao = true;

let enderecoEstrela = "Consultando localidade...";
let chaveConsulta = "";
let statusGPS = "Última localização registrada";

const mensagem = document.getElementById("mensagem");

// ENCONTRA O CADASTRO PELA IDENTIDADE ORIGINAL DO BOI.
// O nomeOriginal permanece igual mesmo depois de renomear no painel.
function cadastroDoBoi(nomeOriginal) {
  return cadastroBois.find(function(boi) {
    return normalizar(boi.nomeOriginal) === normalizar(nomeOriginal);
  }) || cadastroBois.find(function(boi) {
    return !boi.nomeOriginal &&
      normalizar(boi.nome) === normalizar(nomeOriginal);
  });
}

function dadosDoBoi(nomeOriginal) {
  const cadastro = cadastroDoBoi(nomeOriginal);
  return {
    nome: cadastro ? cadastro.nome : nomeOriginal,
    dono: cadastro ? cadastro.dono :
      normalizar(nomeOriginal) === "boi estrela" ?
        "Fábio Silva" : "A definir"
  };
}

// ATUALIZA OS MARCADORES AMARELOS
function atualizarMarcadoresDemo() {
  boisDemo.forEach(function(boi) {
    const marcador = marcadoresDemo.get(boi.nome);
    if (!marcador) return;

    const info = dadosDoBoi(boi.nome);

    marcador.setTooltipContent(
      info.nome + " (teste)"
    );

    marcador.setPopupContent(
      '<div class="popup">' +
      '<strong>' + escaparHTML(info.nome) + '</strong>' +
      '<div>Responsável: ' + escaparHTML(info.dono) + '</div>' +
      '<div class="demo-aviso">DEMONSTRAÇÃO</div>' +
      '<div>Localização fictícia para teste.</div>' +
      '<div>GPS ainda não cadastrado.</div>' +
      '</div>'
    );
  });
}

// CRIA OS MARCADORES DE DEMONSTRAÇÃO
boisDemo.forEach(function(boi) {

  const marcador = L.marker(
    [boi.lat, boi.lng],
    { icon: iconeDemo }
  ).addTo(map);

  marcador.bindTooltip(
    boi.nome + " (teste)",
    {
      permanent: true,
      direction: "bottom",
      offset: [0, 25],
      className: "nome-mapa"
    }
  );

  marcador.bindPopup("");

  marcadoresDemo.set(boi.nome, marcador);

  marcador.on("click", function() {
    map.flyTo(marcador.getLatLng(), 17, {
      animate: true,
      duration: 1
    });
  });
});

atualizarMarcadoresDemo();

// EXIBE OS 11 BOIS ORIGINAIS E OS NOVOS CADASTROS, SEM DUPLICAR.
function mostrarBoisCadastrados() {
  const lista = document.getElementById("listaBois");
  lista.replaceChildren();

  const originais = ["Boi Estrela"].concat(
    boisDemo.map(function(boi) { return boi.nome; })
  );
  const idsUsados = new Set();
  const exibidos = [];

  originais.forEach(function(nomeOriginal) {
    const cadastro = cadastroDoBoi(nomeOriginal);
    if (cadastro) idsUsados.add(cadastro.id);
    const info = dadosDoBoi(nomeOriginal);
    exibidos.push({
      nome: info.nome,
      dono: info.dono,
      gps: nomeOriginal === "Boi Estrela" ? "real" : "demo"
    });
  });

  cadastroBois.forEach(function(boi) {
    if (!idsUsados.has(boi.id)) {
      exibidos.push({
        nome: boi.nome,
        dono: boi.dono,
        gps: "pendente"
      });
    }
  });

  exibidos.sort(function(a, b) {
    return a.nome.localeCompare(b.nome, "pt-BR");
  });

  exibidos.forEach(function(boi) {
    const ficha = document.createElement("div");
    ficha.className = "ficha-boi";

    const nome = document.createElement("strong");
    nome.textContent = "🐂 " + boi.nome;

    const dono = document.createElement("span");
    dono.textContent = "👤 Dono: " + boi.dono;

    const gps = document.createElement("small");
    gps.textContent = boi.gps === "real"
      ? "📍 GPS: consulte o marcador vermelho."
      : boi.gps === "demo"
        ? "🟡 Marcador de demonstração no mapa."
        : "📍 Aguardando configuração do GPS.";

    ficha.append(nome, dono, gps);
    lista.appendChild(ficha);
  });
}

// ATUALIZA POPUP DO BOI ESTRELA
function atualizarPopupEstrela() {

  if (!marcadorEstrela) return;

  const info = dadosDoBoi("Boi Estrela");

  const precisao = circuloPrecisao
    ? Math.round(circuloPrecisao.getRadius()) + " metros"
    : "Não informada";

  marcadorEstrela.setTooltipContent(
    info.nome + " (GPS)"
  );

  marcadorEstrela.setPopupContent(
    '<div class="popup">' +
    '<strong>' + escaparHTML(info.nome) + '</strong>' +
    '<div>Responsável: ' + escaparHTML(info.dono) + '</div>' +
    '<div class="local">' +
    '<b>📍 Rua ou localidade:</b><br>' +
    escaparHTML(enderecoEstrela) +
    '</div>' +
    '<div><b>Precisão do GPS:</b> ' +
    escaparHTML(precisao) + '</div>' +
    '<div>' + escaparHTML(statusGPS) + '</div>' +
    '</div>'
  );
}

// RECEBE CADASTROS EM TEMPO REAL
database.ref("cadastroBois").on(
  "value",
  function(snapshot) {

    cadastroBois = [];

    snapshot.forEach(function(item) {
      const dados = item.val();

      if (
        dados &&
        typeof dados.nome === "string" &&
        dados.nome.trim()
      ) {
        cadastroBois.push({
          id: item.key,
          nome: dados.nome.trim(),
          dono: String(dados.dono || "A definir"),
          nomeOriginal: String(dados.nomeOriginal || "").trim()
        });
      }
    });

    mostrarBoisCadastrados();
    atualizarMarcadoresDemo();
    atualizarPopupEstrela();
  },
  function(erro) {
    document.getElementById("listaBois").textContent =
      "Erro ao carregar os bois cadastrados.";

    console.error(erro);
  }
);

// IDENTIFICAR LOCALIDADE
function identificarLocalidade(dados) {

  const a = dados.address || {};

  const rua =
    a.road ||
    a.pedestrian ||
    a.residential ||
    a.path;

  const local =
    a.suburb ||
    a.neighbourhood ||
    a.village ||
    a.hamlet ||
    a.town ||
    a.city ||
    a.municipality;

  if (rua && local) {
    return rua + " - " + local;
  }

  return rua ||
    local ||
    dados.name ||
    "Localidade não identificada";
}

// CONSULTAR ENDEREÇO
async function consultarLocalidade(lat, lng) {

  const chave =
    lat.toFixed(5) + "," + lng.toFixed(5);

  if (chaveConsulta === chave) return;

  chaveConsulta = chave;
  enderecoEstrela = "Consultando localidade...";
  atualizarPopupEstrela();

  const url =
    "https://nominatim.openstreetmap.org/reverse" +
    "?format=jsonv2" +
    "&lat=" + encodeURIComponent(lat) +
    "&lon=" + encodeURIComponent(lng) +
    "&zoom=18&addressdetails=1" +
    "&accept-language=pt-BR";

  try {

    const resposta = await fetch(url, {
      headers: {
        "Accept": "application/json"
      }
    });

    if (!resposta.ok) {
      throw new Error("Consulta indisponível");
    }

    const dados = await resposta.json();

    if (chaveConsulta !== chave) return;

    enderecoEstrela = identificarLocalidade(dados);
    atualizarPopupEstrela();

  } catch (erro) {

    if (chaveConsulta !== chave) return;

    enderecoEstrela = "Localidade não identificada";
    atualizarPopupEstrela();

    console.warn(erro);
  }
}

// GPS REAL DO BOI ESTRELA
function atualizarEstrela(dados) {

  if (
    dados.latitude == null ||
    dados.longitude == null
  ) return;

  const lat = Number(dados.latitude);
  const lng = Number(dados.longitude);

  if (
    !Number.isFinite(lat) ||
    !Number.isFinite(lng) ||
    Math.abs(lat) > 90 ||
    Math.abs(lng) > 180
  ) return;

  const posicao = [lat, lng];

  const atualizadoEm = Number(dados.atualizadoEm);

  statusGPS = "🟠 Última localização registrada";

  if (
    Number.isFinite(atualizadoEm) &&
    atualizadoEm > 0
  ) {

    const horarioMs = atualizadoEm < 1e11
      ? atualizadoEm * 1000
      : atualizadoEm;

    const idade = Date.now() - horarioMs;

    if (idade >= 0 && idade <= 120000) {
      statusGPS = "🟢 Localização recente";
    }
  }

  if (!marcadorEstrela) {

    marcadorEstrela = L.marker(posicao, {
      icon: iconeReal
    }).addTo(map);

    marcadorEstrela.bindTooltip(
      "Boi Estrela (GPS)",
      {
        permanent: true,
        direction: "bottom",
        offset: [0, 25],
        className: "nome-mapa"
      }
    );

    marcadorEstrela.bindPopup("");

    marcadorEstrela.on("click", function() {

      map.flyTo(
        marcadorEstrela.getLatLng(),
        19,
        {
          animate: true,
          duration: 1.2
        }
      );

      const p = marcadorEstrela.getLatLng();

      consultarLocalidade(p.lat, p.lng);
    });

  } else {

    marcadorEstrela.setLatLng(posicao);
  }

  // PRECISÃO DO GPS
  const valorPrecisao =
    dados.precisao ?? dados.accuracy;

  const precisao = Number(valorPrecisao);

  if (
    valorPrecisao != null &&
    Number.isFinite(precisao) &&
    precisao > 0
  ) {

    if (!circuloPrecisao) {

      circuloPrecisao = L.circle(posicao, {
        radius: precisao,
        color: "#1767bf",
        fillColor: "#1767bf",
        fillOpacity: 0.12,
        weight: 2,
        interactive: false
      }).addTo(map);

    } else {

      circuloPrecisao.setLatLng(posicao);
      circuloPrecisao.setRadius(precisao);
    }

  } else if (circuloPrecisao) {

    map.removeLayer(circuloPrecisao);
    circuloPrecisao = null;
  }

  atualizarPopupEstrela();

  if (primeiraLocalizacao) {

    primeiraLocalizacao = false;

    const pontos = boisDemo.map(function(boi) {
      return [boi.lat, boi.lng];
    });

    pontos.push(posicao);

    map.fitBounds(pontos, {
      padding: [45, 45],
      maxZoom: 15
    });
  }
}

// ESCUTA O GPS EM TEMPO REAL
database.ref("bois/boi-estrela").on(
  "value",
  function(snapshot) {

    const dados = snapshot.val();

    if (dados) {
      atualizarEstrela(dados);
    } else {
      mensagem.textContent =
        "Boi Estrela aguardando GPS. " +
        "Os demais marcadores são demonstrações.";
    }
  },
  function(erro) {

    mensagem.textContent =
      "GPS do Boi Estrela indisponível.";

    console.error(erro);
  }
);

</script>

</body>
</html>
