<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mapa - Boi Estrela</title>

  <!-- LEAFLET -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>


  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #ffffff;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 20px;
    }

    #status {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .info {
      font-size: 20px;
      margin: 8px 0;
    }

    #map {
      width: 100%;
      height: 600px;
      margin-top: 25px;
      border-radius: 15px;
      overflow: hidden;
    }

    .legenda {
      margin-top: 15px;
      padding: 12px;
      background: #f2f2f2;
      border-radius: 10px;
      font-size: 16px;
    }

    @media (max-width: 600px) {

      body {
        padding: 15px;
      }

      h1 {
        font-size: 30px;
      }

      #status {
        font-size: 21px;
      }

      .info {
        font-size: 18px;
      }

      #map {
        height: 60vh;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <h1>🐂 Boi Estrela</h1>


  <div id="status">
    🟡 Aguardando localização...
  </div>


  <div class="info">

    📍 Precisão:

    <strong id="precisao">
      aguardando...
    </strong>

  </div>


  <div class="info">

    🚶 Velocidade:

    <strong id="velocidade">
      aguardando...
    </strong>

  </div>


  <div class="info">

    ⏱️ Última atualização:

    <strong id="tempo">
      aguardando...
    </strong>

  </div>


  <div class="info">

    🛰️ Atualizações recebidas:

    <strong id="contador">
      0
    </strong>

  </div>


  <div id="map"></div>


  <div class="legenda">

    📍 Marcador = posição atual do Boi Estrela

    <br><br>

    ⭕ Círculo = margem de precisão do GPS

    <br><br>

    🔵 Linha = percurso realizado

  </div>


</div>



<script>


// =======================================
// FIREBASE
// =======================================


const firebaseConfig = {

  apiKey:
    "AIzaSyCXNTSiw5rVRBh9hTKR_bLWzYU72XlpEWQ",

  authDomain:
    "rastreamento-reisado.firebaseapp.com",

  databaseURL:
    "https://rastreamento-reisado-default-rtdb.firebaseio.com",

  projectId:
    "rastreamento-reisado",

  storageBucket:
    "rastreamento-reisado.firebasestorage.app",

  messagingSenderId:
    "796420970266",

  appId:
    "1:796420970266:web:a0f082d40cd1b9410e3ea3"

};


firebase.initializeApp(
  firebaseConfig
);


const database =
  firebase.database();



// =======================================
// MAPA
// =======================================


const map =
  L.map("map").setView(
    [-4.3, -42.0],
    14
  );


L.tileLayer(

  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

  {

    maxZoom: 19,

    attribution:
      "&copy; OpenStreetMap"

  }

).addTo(map);



// =======================================
// VARIÁVEIS
// =======================================


let marcador = null;


let circuloPrecisao = null;


let linhaPercurso =
  L.polyline(
    [],
    {
      color: "blue",
      weight: 5,
      opacity: 0.8
    }
  ).addTo(map);


let percurso = [];


let contador = 0;


let primeiraPosicao = true;


let ultimoAtualizadoEm = 0;


let ultimaPosicaoPercurso = null;



// =======================================
// REFERÊNCIA DO BOI NO FIREBASE
// =======================================


const boiRef =
  database.ref(
    "bois/boi-estrela"
  );



// =======================================
// CALCULAR DISTÂNCIA
// =======================================


function calcularDistancia(
  lat1,
  lon1,
  lat2,
  lon2
) {


  const R =
    6371000;


  const rad =
    Math.PI / 180;


  const dLat =
    (lat2 - lat1) * rad;


  const dLon =
    (lon2 - lon1) * rad;


  const a =

    Math.sin(dLat / 2) *
    Math.sin(dLat / 2)

    +

    Math.cos(lat1 * rad) *
    Math.cos(lat2 * rad) *

    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);


  const c =

    2 *

    Math.atan2(

      Math.sqrt(a),

      Math.sqrt(1 - a)

    );


  return R * c;

}



// =======================================
// RECEBER FIREBASE EM TEMPO REAL
// =======================================


boiRef.on(

  "value",

  function(snapshot) {


    const dados =
      snapshot.val();


    if (!dados) {


      document
        .getElementById("status")
        .innerHTML =

        "🔴 Nenhuma localização disponível";


      return;

    }



    const latitude =
      Number(
        dados.latitude
      );


    const longitude =
      Number(
        dados.longitude
      );


    const precisao =
      Number(
        dados.precisao || 0
      );


    /*
    O CELULAR ENVIA VELOCIDADE
    EM METROS POR SEGUNDO.

    Multiplicamos por 3.6
    para mostrar km/h.
    */


    const velocidadeMS =
      Number(
        dados.velocidade || 0
      );


    const velocidadeKMH =
      velocidadeMS * 3.6;


    const atualizadoEm =
      Number(
        dados.atualizadoEm || 0
      );



    // Segurança


    if (

      !Number.isFinite(latitude)

      ||

      !Number.isFinite(longitude)

    ) {


      return;

    }



    ultimoAtualizadoEm =
      atualizadoEm;



    const novaPosicao = [

      latitude,

      longitude

    ];



    // =======================================
    // CONTADOR
    // =======================================


    contador++;


    document
      .getElementById("contador")
      .innerText =

      contador;



    // =======================================
    // PRECISÃO
    // =======================================


    document
      .getElementById("precisao")
      .innerText =

      Math.round(
        precisao
      ) +

      " metros";



    // =======================================
    // VELOCIDADE
    // =======================================


    document
      .getElementById("velocidade")
      .innerText =

      velocidadeKMH
        .toFixed(1) +

      " km/h";



    // =======================================
    // MARCADOR
    // =======================================


    if (!marcador) {


      marcador =
        L.marker(
          novaPosicao
        )
        .addTo(map);


      marcador
        .bindPopup(
          "🐂 Boi Estrela"
        )
        .openPopup();


    }

    else {


      marcador
        .setLatLng(
          novaPosicao
        );


    }



    // =======================================
    // CÍRCULO DA PRECISÃO
    // =======================================


    if (!circuloPrecisao) {


      circuloPrecisao =
        L.circle(

          novaPosicao,

          {

            radius:
              precisao

          }

        )
        .addTo(map);


    }

    else {


      circuloPrecisao
        .setLatLng(
          novaPosicao
        );


      circuloPrecisao
        .setRadius(
          precisao
        );


    }



    // =======================================
    // LINHA DO PERCURSO
    // =======================================


    let adicionarPercurso =
      false;



    if (
      ultimaPosicaoPercurso === null
    ) {


      adicionarPercurso =
        true;


    }

    else {


      const distancia =

        calcularDistancia(

          ultimaPosicaoPercurso[0],

          ultimaPosicaoPercurso[1],

          latitude,

          longitude

        );



      /*
      Evita desenhar pequenas
      oscilações do GPS.

      Só adiciona um novo ponto
      quando andar pelo menos
      3 metros.
      */


      if (
        distancia >= 3
      ) {


        adicionarPercurso =
          true;


      }


    }



    if (
      adicionarPercurso
    ) {


      percurso.push(
        novaPosicao
      );


      ultimaPosicaoPercurso =
        novaPosicao;



      /*
      Limite para não deixar
      o navegador pesado.
      */


      if (
        percurso.length > 500
      ) {


        percurso.shift();


      }



      linhaPercurso
        .setLatLngs(
          percurso
        );


    }



    // =======================================
    // ACOMPANHAR O BOI NO MAPA
    // =======================================


    if (
      primeiraPosicao
    ) {


      map.setView(

        novaPosicao,

        18

      );


      primeiraPosicao =
        false;


    }

    else {


      map.panTo(

        novaPosicao,

        {

          animate: true,

          duration: 0.8

        }

      );


    }



    // =======================================
    // STATUS
    // =======================================


    atualizarStatus();


  },



  function(erro) {


    console.error(
      "Erro Firebase:",
      erro
    );


    document
      .getElementById("status")
      .innerHTML =

      "🔴 Erro de conexão com Firebase";


  }

);



// =======================================
// ONLINE / OFFLINE
// =======================================


function atualizarStatus() {


  if (
    !ultimoAtualizadoEm
  ) {


    return;


  }



  const agora =
    Date.now();



  const diferenca =
    agora -
    ultimoAtualizadoEm;



  const segundos =

    Math.max(

      0,

      Math.floor(
        diferenca / 1000
      )

    );



  const status =
    document
      .getElementById(
        "status"
      );



  /*
  ONLINE:
  recebeu localização
  nos últimos 60 segundos
  */


  if (
    segundos <= 60
  ) {


    status.innerHTML =

      "🟢 Boi Estrela ONLINE";


  }


  /*
  SINAL FRACO:
  entre 1 e 3 minutos
  */


  else if (
    segundos <= 180
  ) {


    status.innerHTML =

      "🟡 Boi Estrela - SINAL FRACO";


  }


  /*
  OFFLINE:
  mais de 3 minutos
  */


  else {


    status.innerHTML =

      "🔴 Boi Estrela OFFLINE";


  }



  mostrarTempo(
    segundos
  );


}



// =======================================
// ÚLTIMA ATUALIZAÇÃO
// =======================================


function mostrarTempo(
  segundos
) {


  let texto = "";


  if (
    segundos < 60
  ) {


    texto =

      "há " +

      segundos +

      (
        segundos === 1
        ? " segundo"
        : " segundos"
      );


  }


  else if (
    segundos < 3600
  ) {


    const minutos =

      Math.floor(
        segundos / 60
      );


    texto =

      "há " +

      minutos +

      (
        minutos === 1
        ? " minuto"
        : " minutos"
      );


  }


  else if (
    segundos < 86400
  ) {


    const horas =

      Math.floor(
        segundos / 3600
      );


    texto =

      "há " +

      horas +

      (
        horas === 1
        ? " hora"
        : " horas"
      );


  }


  else {


    const dias =

      Math.floor(
        segundos / 86400
      );


    texto =

      "há " +

      dias +

      (
        dias === 1
        ? " dia"
        : " dias"
      );


  }



  document
    .getElementById("tempo")
    .innerText =

    texto;


}



// =======================================
// ATUALIZA O RELÓGIO
// SEM CONSULTAR FIREBASE NOVAMENTE
// =======================================


setInterval(

  atualizarStatus,

  1000

);


</script>


</body>

</html>
