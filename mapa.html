
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Monitoramento dos Bois - Boa Hora PI</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
    }

    header {
      background: #104b91;
      color: white;
      text-align: center;
      padding: 17px 12px;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 23px;
    }

    header p {
      margin: 0;
      font-size: 14px;
    }

    #map {
      width: 100%;
      height: calc(100dvh - 210px);
      min-height: 350px;
    }

    .boi-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      background: white;
      border: 3px solid #c52228;
      box-shadow: 0 3px 9px #0005;
    }

    .boi-demo {
      background: #fff3b0;
      border-color: #d49b00;
    }

    .nome-mapa {
      background: white;
      border: 1px solid #bbb;
      border-radius: 7px;
      padding: 3px 7px;
      font-weight: bold;
      font-size: 12px;
      white-space: nowrap;
      box-shadow: 0 2px 5px #0002;
    }

    .popup {
      min-width: 200px;
      line-height: 1.6;
      font-size: 14px;
    }

    .popup strong {
      font-size: 17px;
      color: #104b91;
    }

    .local {
      background: #f0f4f9;
      padding: 8px;
      border-radius: 8px;
      margin-top: 8px;
    }

    .aviso-demo {
      color: #8a5900;
      font-weight: bold;
    }

    .acoes {
      background: white;
      text-align: center;
      padding: 12px;
    }

    .agenda {
      display: inline-block;
      background: #c52228;
      color: white;
      text-decoration: none;
      font-weight: bold;
      padding: 12px 22px;
      border-radius: 12px;
    }

    #mensagem {
      font-size: 13px;
      color: #555;
      margin: 10px 0 0;
    }
  </style>
</head>

<body>

<header>
  <h1>🐂 Monitoramento dos Bois</h1>
  <p>Reisado de Boa Hora - Piauí</p>
</header>

<div id="map"></div>

<div class="acoes">
  <a class="agenda" href="./agenda.html">
    📅 Agenda dos Bois
  </a>

  <p id="mensagem">
    🟡 Marcadores amarelos são demonstrações.
  </p>
</div>

<script>
  // FIREBASE DO PROJETO
  const firebaseConfig = {
    apiKey: "AIzaSyCXNTSiw5rVRBh9hTKR_bLWzYU72XlpEWQ",
    authDomain: "rastreamento-reisado.firebaseapp.com",
    databaseURL: "https://rastreamento-reisado-default-rtdb.firebaseio.com",
    projectId: "rastreamento-reisado",
    storageBucket: "rastreamento-reisado.firebasestorage.app",
    messagingSenderId: "796420970266",
    appId: "1:796420970266:web:a0f082d40cd1b9410e3ea3"
  };

  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  // MAPA
  const map = L.map("map").setView(
    [-4.3074, -42.0363], 14
  );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }
  ).addTo(map);

  // ÍCONES
  function criarIcone(demo) {
    return L.divIcon({
      className: "",
      html: '<div class="boi-icon ' +
            (demo ? 'boi-demo' : '') +
            '">🐂</div>',
      iconSize: [48, 48],
      iconAnchor: [24, 24],
      popupAnchor: [0, -24]
    });
  }

  const iconeReal = criarIcone(false);
  const iconeDemo = criarIcone(true);

  // POSIÇÕES FICTÍCIAS, APENAS PARA TESTE
  // Não representam a localização verdadeira dos bois.
  const boisDemo = [
    { nome: "Boi Caridade", lat: -4.3035, lng: -42.0340 },
    { nome: "Boi Ramalhete", lat: -4.3050, lng: -42.0390 },
    { nome: "Boi Soberano", lat: -4.3080, lng: -42.0320 },
    { nome: "Boi Mimoso", lat: -4.3105, lng: -42.0370 },
    { nome: "Boi Luar", lat: -4.3065, lng: -42.0430 },
    { nome: "Boi Bugarim", lat: -4.3120, lng: -42.0410 },
    { nome: "Boi Encantado", lat: -4.3010, lng: -42.0370 },
    { nome: "Boi Flor do Sertão", lat: -4.3140, lng: -42.0340 },
    { nome: "Boi Diamante", lat: -4.3090, lng: -42.0460 },
    { nome: "Boi Esperança", lat: -4.3000, lng: -42.0430 }
  ];

  // MOSTRA OS 10 BOIS DE DEMONSTRAÇÃO
  boisDemo.forEach(function(boi) {
    const marcador = L.marker(
      [boi.lat, boi.lng],
      { icon: iconeDemo }
    ).addTo(map);

    marcador.bindTooltip(
      boi.nome + " (teste)",
      {
        permanent: true,
        direction: "bottom",
        offset: [0, 22],
        className: "nome-mapa"
      }
    );

    marcador.bindPopup(`
      <div class="popup">
        <strong>🐂 ${boi.nome}</strong>
        <div class="aviso-demo">
          DEMONSTRAÇÃO
        </div>
        <div>
          Localização fictícia para teste.
        </div>
        <div>
          GPS ainda não cadastrado.
        </div>
      </div>
    `);

    marcador.on("click", function() {
      map.flyTo(marcador.getLatLng(), 17, {
        animate: true,
        duration: 1
      });
    });
  });

  // BOI ESTRELA - LOCALIZAÇÃO REAL
  let marcadorEstrela = null;
  let circuloPrecisao = null;
  let primeiraLocalizacao = true;
  let enderecoEstrela = "Consultando localidade...";
  let chaveConsulta = "";
  let statusGPS = "Última localização registrada";

  const mensagem = document.getElementById("mensagem");

  function escaparHTML(texto) {
    return String(texto).replace(
      /[&<>"']/g,
      function(c) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[c];
      }
    );
  }

  function atualizarPopupEstrela() {
    if (!marcadorEstrela) return;

    const precisao = circuloPrecisao
      ? Math.round(circuloPrecisao.getRadius()) + " metros"
      : "Não informada";

    marcadorEstrela.setPopupContent(`
      <div class="popup">
        <strong>🐂 Boi Estrela</strong>
        <div>Responsável: Fábio Silva</div>

        <div class="local">
          <b>📍 Rua ou localidade:</b><br>
          ${escaparHTML(enderecoEstrela)}
        </div>

        <div>
          <b>Precisão:</b> ${precisao}
        </div>

        <div>${statusGPS}</div>
      </div>
    `);
  }

  function identificarLocalidade(dados) {
    const a = dados.address || {};

    const rua =
      a.road ||
      a.pedestrian ||
      a.residential ||
      a.path;

    const local =
      a.suburb ||
      a.neighbourhood ||
      a.village ||
      a.hamlet ||
      a.town ||
      a.city ||
      a.municipality;

    if (rua && local) {
      return rua + " - " + local;
    }

    return rua ||
           local ||
           dados.name ||
           "Localidade não identificada";
  }

  async function consultarLocalidade(lat, lng) {
    const chave =
      lat.toFixed(5) + "," + lng.toFixed(5);

    if (chaveConsulta === chave) return;

    chaveConsulta = chave;
    enderecoEstrela = "Consultando localidade...";
    atualizarPopupEstrela();

    const url =
      "https://nominatim.openstreetmap.org/reverse" +
      "?format=jsonv2" +
      "&lat=" + encodeURIComponent(lat) +
      "&lon=" + encodeURIComponent(lng) +
      "&zoom=18&addressdetails=1" +
      "&accept-language=pt-BR";

    try {
      const resposta = await fetch(url, {
        headers: { "Accept": "application/json" }
      });

      if (!resposta.ok) {
        throw new Error("Consulta indisponível");
      }

      const dados = await resposta.json();

      if (chaveConsulta !== chave) return;

      enderecoEstrela = identificarLocalidade(dados);
      atualizarPopupEstrela();

    } catch (erro) {
      if (chaveConsulta !== chave) return;

      enderecoEstrela =
        "Localidade não identificada";
      atualizarPopupEstrela();
      console.warn(erro);
    }
  }

  function atualizarEstrela(dados) {
    if (
      dados.latitude == null ||
      dados.longitude == null
    ) return;

    const lat = Number(dados.latitude);
    const lng = Number(dados.longitude);

    if (
      !Number.isFinite(lat) ||
      !Number.isFinite(lng) ||
      Math.abs(lat) > 90 ||
      Math.abs(lng) > 180
    ) return;

    const posicao = [lat, lng];

    const atualizadoEm = Number(dados.atualizadoEm);
    statusGPS = "🟠 Última localização registrada";

    if (
      Number.isFinite(atualizadoEm) &&
      atualizadoEm > 0
    ) {
      const horarioMs = atualizadoEm < 1e11
        ? atualizadoEm * 1000
        : atualizadoEm;

      const idade = Date.now() - horarioMs;

      if (idade >= 0 && idade <= 120000) {
        statusGPS = "🟢 Localização recente";
      }
    }

    if (!marcadorEstrela) {
      marcadorEstrela = L.marker(posicao, {
        icon: iconeReal
      }).addTo(map);

      marcadorEstrela.bindTooltip(
        "Boi Estrela (GPS)",
        {
          permanent: true,
          direction: "bottom",
          offset: [0, 22],
          className: "nome-mapa"
        }
      );

      marcadorEstrela.bindPopup("");

      marcadorEstrela.on("click", function() {
        map.flyTo(
          marcadorEstrela.getLatLng(),
          19,
          { animate: true, duration: 1.2 }
        );

        const p = marcadorEstrela.getLatLng();
        consultarLocalidade(p.lat, p.lng);
      });

    } else {
      marcadorEstrela.setLatLng(posicao);
    }

    const valorPrecisao =
      dados.precisao ?? dados.accuracy;

    const precisao = Number(valorPrecisao);

    if (
      valorPrecisao != null &&
      Number.isFinite(precisao) &&
      precisao > 0
    ) {
      if (!circuloPrecisao) {
        circuloPrecisao = L.circle(posicao, {
          radius: precisao,
          color: "#1767bf",
          fillColor: "#1767bf",
          fillOpacity: 0.12,
          weight: 2,
          interactive: false
        }).addTo(map);
      } else {
        circuloPrecisao.setLatLng(posicao);
        circuloPrecisao.setRadius(precisao);
      }
    } else if (circuloPrecisao) {
      map.removeLayer(circuloPrecisao);
      circuloPrecisao = null;
    }

    atualizarPopupEstrela();

    if (primeiraLocalizacao) {
      primeiraLocalizacao = false;

      // Enquadra o boi real e os bois fictícios
      const pontos = boisDemo.map(function(b) {
        return [b.lat, b.lng];
      });

      pontos.push(posicao);

      map.fitBounds(pontos, {
        padding: [45, 45],
        maxZoom: 15
      });
    }
  }

  // LEITURA DO GPS REAL NO FIREBASE
  database.ref("bois/boi-estrela").on(
    "value",
    function(snapshot) {
      const dados = snapshot.val();

      if (dados) {
        atualizarEstrela(dados);
      } else {
        mensagem.textContent =
          "Boi Estrela aguardando GPS. " +
          "Os demais bois são demonstrações.";
      }
    },
    function(erro) {
      mensagem.textContent =
        "GPS do Boi Estrela indisponível. " +
        "Os demais bois são demonstrações.";

      console.error(erro);
    }
  );
</script>

</body>
</html>
