
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Monitoramento dos Bois - Boa Hora PI</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
    }

    header {
      background: #104b91;
      color: white;
      text-align: center;
      padding: 17px 12px;
    }

    header h1 {
      font-size: 23px;
      margin: 0 0 6px;
    }

    header p {
      font-size: 14px;
      margin: 0;
    }

    #map {
      width: 100%;
      height: calc(100dvh - 185px);
      min-height: 350px;
    }

    .boi-icon {
      width: 54px;
      height: 54px;
      background: white;
      border: 3px solid #c52228;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      box-shadow: 0 3px 10px #0005;
    }

    .popup {
      text-align: center;
      min-width: 170px;
      line-height: 1.6;
      font-size: 14px;
    }

    .popup strong {
      font-size: 18px;
      color: #104b91;
    }

    .acoes {
      text-align: center;
      background: white;
      padding: 12px;
    }

    .agenda {
      display: inline-block;
      background: #c52228;
      color: white;
      text-decoration: none;
      font-weight: bold;
      padding: 12px 22px;
      border-radius: 12px;
    }

    #mensagem {
      color: #555;
      font-size: 13px;
      margin: 10px 0 0;
    }
  </style>
</head>

<body>

<header>
  <h1>🐂 Monitoramento dos Bois</h1>
  <p>Reisado de Boa Hora - Piauí</p>
</header>

<div id="map"></div>

<div class="acoes">
  <a class="agenda" href="./agenda.html">
    📅 Agenda dos Bois
  </a>

  <p id="mensagem">
    Buscando localização dos bois...
  </p>
</div>

<script>
  // CONFIGURAÇÃO DO FIREBASE
  const firebaseConfig = {
    apiKey: "AIzaSyCXNTSiw5rVRBh9hTKR_bLWzYU72XlpEWQ",
    authDomain: "rastreamento-reisado.firebaseapp.com",
    databaseURL: "https://rastreamento-reisado-default-rtdb.firebaseio.com",
    projectId: "rastreamento-reisado",
    storageBucket: "rastreamento-reisado.firebasestorage.app",
    messagingSenderId: "796420970266",
    appId: "1:796420970266:web:a0f082d40cd1b9410e3ea3"
  };

  firebase.initializeApp(firebaseConfig);

  const database = firebase.database();

  // MAPA INICIAL
  const map = L.map("map").setView(
    [-4.3074, -42.0363], 14
  );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }
  ).addTo(map);

  // ÍCONE DO BOI
  const iconeBoi = L.divIcon({
    className: "",
    html: '<div class="boi-icon">🐂</div>',
    iconSize: [54, 54],
    iconAnchor: [27, 27],
    popupAnchor: [0, -28]
  });

  // BOIS CADASTRADOS
  const bois = {
    "boi-estrela": {
      nome: "Boi Estrela",
      responsavel: "Fábio Silva"
    }
  };

  const marcadores = {};
  let primeiraLocalizacao = true;

  const mensagem = document.getElementById("mensagem");

  // CENTRALIZA E APROXIMA O BOI
  function mostrarLocalizacao(marcador) {
    const posicao = marcador.getLatLng();

    map.flyTo(posicao, 18, {
      animate: true,
      duration: 1.2
    });

    marcador.openPopup();
  }

  // ATUALIZA A POSIÇÃO DO BOI
  function atualizarBoi(id, dados) {
    const latitude = Number(dados.latitude);
    const longitude = Number(dados.longitude);

    if (
      dados.latitude == null ||
      dados.longitude == null ||
      !Number.isFinite(latitude) ||
      !Number.isFinite(longitude) ||
      Math.abs(latitude) > 90 ||
      Math.abs(longitude) > 180
    ) {
      return;
    }

    const posicao = [latitude, longitude];
    const cadastro = bois[id];

    let status = "Última localização registrada";

    const atualizadoEm = Number(dados.atualizadoEm);

    if (
      Number.isFinite(atualizadoEm) &&
      atualizadoEm > 0
    ) {
      const horarioMs = atualizadoEm < 1e11
        ? atualizadoEm * 1000
        : atualizadoEm;

      const idade = Date.now() - horarioMs;

      if (idade >= 0 && idade <= 120000) {
        status = "🟢 Localização recente";
      } else {
        status = "🟠 Última localização registrada";
      }
    }

    const conteudo = `
      <div class="popup">
        <strong>🐂 ${cadastro.nome}</strong>
        <div>Responsável: ${cadastro.responsavel}</div>
        <div>${status}</div>
      </div>
    `;

    if (!marcadores[id]) {
      const marcador = L.marker(posicao, {
        icon: iconeBoi
      }).addTo(map);

      marcador.bindPopup(conteudo);

      marcador.on("click", function() {
        mostrarLocalizacao(marcador);
      });

      marcadores[id] = marcador;
    } else {
      marcadores[id].setLatLng(posicao);
      marcadores[id].setPopupContent(conteudo);
    }

    mensagem.textContent =
      "Toque no boi para aproximar sua localização.";

    // MOSTRA A PRIMEIRA LOCALIZAÇÃO RECEBIDA
    if (primeiraLocalizacao) {
      map.setView(posicao, 16);
      primeiraLocalizacao = false;
    }
  }

  // CONEXÃO COM O FIREBASE
  Object.keys(bois).forEach(function(id) {
    database.ref("bois/" + id).on(
      "value",
      function(snapshot) {
        const dados = snapshot.val();

        if (dados) {
          atualizarBoi(id, dados);
        } else if (!Object.keys(marcadores).length) {
          mensagem.textContent =
            "Aguardando localização do boi.";
        }
      },
      function(erro) {
        mensagem.textContent =
          "Não foi possível consultar a localização.";
        console.error(erro);
      }
    );
  });
</script>

</body>
</html>
