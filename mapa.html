
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Monitoramento dos Bois - Boa Hora PI</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
    }

    header {
      background: #104b91;
      color: white;
      text-align: center;
      padding: 17px 12px;
    }

    header h1 {
      font-size: 23px;
      margin: 0 0 6px;
    }

    header p {
      font-size: 14px;
      margin: 0;
    }

    #map {
      width: 100%;
      height: calc(100dvh - 200px);
      min-height: 350px;
    }

    .boi-icon {
      width: 54px;
      height: 54px;
      background: white;
      border: 3px solid #c52228;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      box-shadow: 0 3px 10px #0005;
    }

    .popup {
      min-width: 215px;
      max-width: 260px;
      line-height: 1.5;
      font-size: 14px;
    }

    .popup strong {
      color: #104b91;
      font-size: 18px;
    }

    .local {
      margin-top: 8px;
      padding: 8px;
      border-radius: 8px;
      background: #f0f4f9;
    }

    .acoes {
      text-align: center;
      background: white;
      padding: 12px;
    }

    .agenda {
      display: inline-block;
      background: #c52228;
      color: white;
      text-decoration: none;
      font-weight: bold;
      padding: 12px 22px;
      border-radius: 12px;
    }

    #mensagem {
      color: #555;
      font-size: 13px;
      margin: 10px 0 0;
    }
  </style>
</head>

<body>

<header>
  <h1>🐂 Monitoramento dos Bois</h1>
  <p>Reisado de Boa Hora - Piauí</p>
</header>

<div id="map"></div>

<div class="acoes">
  <a class="agenda" href="./agenda.html">
    📅 Agenda dos Bois
  </a>

  <p id="mensagem">
    Buscando localização dos bois...
  </p>
</div>

<script>
  // CONFIGURAÇÃO DO FIREBASE
  const firebaseConfig = {
    apiKey: "AIzaSyCXNTSiw5rVRBh9hTKR_bLWzYU72XlpEWQ",
    authDomain: "rastreamento-reisado.firebaseapp.com",
    databaseURL: "https://rastreamento-reisado-default-rtdb.firebaseio.com",
    projectId: "rastreamento-reisado",
    storageBucket: "rastreamento-reisado.firebasestorage.app",
    messagingSenderId: "796420970266",
    appId: "1:796420970266:web:a0f082d40cd1b9410e3ea3"
  };

  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  // MAPA
  const map = L.map("map").setView(
    [-4.3074, -42.0363], 14
  );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }
  ).addTo(map);

  // ÍCONE DO BOI
  const iconeBoi = L.divIcon({
    className: "",
    html: '<div class="boi-icon">🐂</div>',
    iconSize: [54, 54],
    iconAnchor: [27, 27],
    popupAnchor: [0, -28]
  });

  // BOIS CADASTRADOS
  const bois = {
    "boi-estrela": {
      nome: "Boi Estrela",
      responsavel: "Fábio Silva"
    }
  };

  const marcadores = {};
  const circulos = {};
  const enderecos = {};
  const consultas = {};

  let primeiraLocalizacao = true;

  const mensagem = document.getElementById("mensagem");

  // EVITA INSERIR TEXTO EXTERNO COMO HTML
  function escaparHTML(texto) {
    return String(texto).replace(
      /[&<>"']/g,
      function(caractere) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[caractere];
      }
    );
  }

  // EXTRAI RUA OU LOCALIDADE
  function nomeLocal(dados) {
    const a = dados.address || {};

    const rua =
      a.road ||
      a.pedestrian ||
      a.residential ||
      a.path ||
      a.footway;

    const localidade =
      a.suburb ||
      a.neighbourhood ||
      a.village ||
      a.hamlet ||
      a.town ||
      a.city ||
      a.municipality;

    if (rua && localidade) {
      return rua + " - " + localidade;
    }

    return rua ||
           localidade ||
           dados.name ||
           "Rua ou localidade não identificada";
  }

  // MONTA A JANELA DO BOI
  function atualizarPopup(id) {
    const cadastro = bois[id];
    const marcador = marcadores[id];

    if (!marcador) return;

    const local = enderecos[id] ||
      "Consultando rua ou localidade...";

    const precisao = circulos[id]
      ? Math.round(circulos[id].getRadius()) + " metros"
      : "Não informada pelo GPS";

    const status = marcador.statusGPS ||
      "Última localização registrada";

    marcador.setPopupContent(`
      <div class="popup">
        <strong>🐂 ${escaparHTML(cadastro.nome)}</strong>
        <div>
          Responsável:
          ${escaparHTML(cadastro.responsavel)}
        </div>

        <div class="local">
          <b>📍 Localização:</b><br>
          ${escaparHTML(local)}
        </div>

        <div style="margin-top:8px">
          <b>Precisão do GPS:</b> ${precisao}
        </div>

        <div style="margin-top:6px">
          ${status}
        </div>
      </div>
    `);
  }

  // CONSULTA A RUA PELO OPENSTREETMAP
  async function consultarEndereco(id, latitude, longitude) {
    const chave = latitude.toFixed(5) + "," +
                  longitude.toFixed(5);

    // Evita consultas repetidas para a mesma posição
    if (consultas[id] === chave) return;

    consultas[id] = chave;
    enderecos[id] = "Consultando rua ou localidade...";
    atualizarPopup(id);

    const url =
      "https://nominatim.openstreetmap.org/reverse" +
      "?format=jsonv2" +
      "&lat=" + encodeURIComponent(latitude) +
      "&lon=" + encodeURIComponent(longitude) +
      "&zoom=18&addressdetails=1" +
      "&accept-language=pt-BR";

    try {
      const resposta = await fetch(url, {
        headers: {
          "Accept": "application/json"
        }
      });

      if (!resposta.ok) {
        throw new Error("Consulta indisponível");
      }

      const dados = await resposta.json();

      // Descarta resultado antigo se o boi se moveu
      if (consultas[id] !== chave) return;

      enderecos[id] = nomeLocal(dados);
      atualizarPopup(id);

    } catch (erro) {
      if (consultas[id] !== chave) return;

      enderecos[id] =
        "Rua não identificada. Consulte a posição no mapa.";

      atualizarPopup(id);
      console.warn("Endereço indisponível:", erro);
    }
  }

  // CENTRALIZA E APROXIMA O BOI
  function mostrarLocalizacao(marcador) {
    map.flyTo(marcador.getLatLng(), 19, {
      animate: true,
      duration: 1.2
    });

    marcador.openPopup();
  }

  // ATUALIZA POSIÇÃO E PRECISÃO
  function atualizarBoi(id, dados) {
    if (
      dados.latitude == null ||
      dados.longitude == null
    ) return;

    const latitude = Number(dados.latitude);
    const longitude = Number(dados.longitude);

    if (
      !Number.isFinite(latitude) ||
      !Number.isFinite(longitude) ||
      Math.abs(latitude) > 90 ||
      Math.abs(longitude) > 180
    ) return;

    const posicao = [latitude, longitude];

    const atualizadoEm = Number(dados.atualizadoEm);
    let status = "🟠 Última localização registrada";

    if (
      Number.isFinite(atualizadoEm) &&
      atualizadoEm > 0
    ) {
      const horarioMs = atualizadoEm < 1e11
        ? atualizadoEm * 1000
        : atualizadoEm;

      const idade = Date.now() - horarioMs;

      if (idade >= 0 && idade <= 120000) {
        status = "🟢 Localização recente";
      }
    }

    if (!marcadores[id]) {
      const marcador = L.marker(posicao, {
        icon: iconeBoi
      }).addTo(map);

      marcador.bindPopup("");

      marcador.on("click", function() {
        mostrarLocalizacao(marcador);
        consultarEndereco(id, latitudeAtual(id), longitudeAtual(id));
      });

      marcadores[id] = marcador;

    } else {
      marcadores[id].setLatLng(posicao);
    }

    marcadores[id].statusGPS = status;

    // LÊ A PRECISÃO INFORMADA PELO GPS
    const precisaoBruta =
      dados.precisao ?? dados.accuracy;

    const precisao = Number(precisaoBruta);

    if (
      precisaoBruta != null &&
      Number.isFinite(precisao) &&
      precisao > 0
    ) {
      if (!circulos[id]) {
        circulos[id] = L.circle(posicao, {
          radius: precisao,
          color: "#1767bf",
          fillColor: "#1767bf",
          fillOpacity: 0.12,
          weight: 2,
          interactive: false
        }).addTo(map);
      } else {
        circulos[id].setLatLng(posicao);
        circulos[id].setRadius(precisao);
      }
    } else if (circulos[id]) {
      map.removeLayer(circulos[id]);
      delete circulos[id];
    }

    atualizarPopup(id);

    mensagem.textContent =
      "Toque no boi para ver a rua e a localização.";

    if (primeiraLocalizacao) {
      map.setView(posicao, 16);
      primeiraLocalizacao = false;
    }
  }

  function latitudeAtual(id) {
    return marcadores[id].getLatLng().lat;
  }

  function longitudeAtual(id) {
    return marcadores[id].getLatLng().lng;
  }

  // RECEBE OS DADOS DO FIREBASE
  Object.keys(bois).forEach(function(id) {
    database.ref("bois/" + id).on(
      "value",
      function(snapshot) {
        const dados = snapshot.val();

        if (dados) {
          atualizarBoi(id, dados);
        } else if (!Object.keys(marcadores).length) {
          mensagem.textContent =
            "Aguardando localização do boi.";
        }
      },
      function(erro) {
        mensagem.textContent =
          "Não foi possível consultar a localização.";
        console.error(erro);
      }
    );
  });
</script>

</body>
</html>
