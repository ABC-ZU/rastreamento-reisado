
<!-- =========================================
     MAPA ADMINISTRATIVO DOS BOIS
========================================= -->

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

#mapaAdministrativo {
  width: 100%;
  height: 550px;
  border: 3px solid #e9ba4e;
  border-radius: 12px;
  z-index: 1;
  margin-top: 15px;
}

.icone-admin-boi {
  background: transparent;
  border: none;
}

.icone-admin-boi img {
  width: 52px;
  height: 52px;
  border: 4px solid #e9ba4e;
  border-radius: 50%;
  background: white;
  object-fit: contain;
  box-shadow: 0 3px 10px #0005;
}

.rotulo-admin-boi {
  background: white;
  color: #850c29;
  font-weight: bold;
  text-align: center;
  border: 1px solid #e9ba4e;
  border-radius: 5px;
  padding: 5px;
}

@media(max-width:650px) {

  #mapaAdministrativo {
    height: 470px;
  }

}

</style>

<script>

(function () {

"use strict";

/* =========================================
   CONFIGURAÇÕES
========================================= */

const CENTRO_ADMIN = [
  -4.408329,
  -42.122859
];

const ZOOM_ADMIN = 17;

const posicoesRef = db.ref("posicoesBois");

let mapaAdmin = null;

let grupoAdmin = null;

let marcadoresAdmin = new Map();

let alteracoesMapa = false;

let salvandoMapa = false;

let carregandoMapa = false;

let anoCarregado = null;

let numeroConsulta = 0;

let mapaCarregado = false;

const obter = id =>
  document.getElementById(id);

/* =========================================
   CRIAR NOVA ABA
========================================= */

const abaMapa = document.createElement("button");

abaMapa.type = "button";

abaMapa.textContent = "🗺️ Mapa dos Bois";

abaMapa.dataset.aba = "mapa";

document.querySelector(".abas")
  .appendChild(abaMapa);

/* =========================================
   CRIAR SEÇÃO ADMINISTRATIVA
========================================= */

const secaoMapa = document.createElement("section");

secaoMapa.id = "secaoMapa";

secaoMapa.className = "oculto";

secaoMapa.innerHTML = `

<div class="caixa">

  <h2>🗺️ Posicionar Bois no Mapa</h2>

  <div class="aviso">

    Arraste os ícones dos bois até os pontos
    culturais desejados em Boa Hora.

    <br><br>

    Depois clique em
    <strong>Salvar posições</strong>.

    <br><br>

    As posições serão exibidas no mapa
    público do Reisado Digital 2.0.

    Não existe rastreamento GPS.

  </div>

  <label for="anoMapaAdmin">
    Selecionar temporada
  </label>

  <select id="anoMapaAdmin"></select>

  <div class="acoes">

    <button
      id="centralizarMapaAdmin"
      type="button">

      📍 Centralizar Boa Hora

    </button>

    <button
      id="recarregarMapaAdmin"
      type="button"
      class="secundario">

      🔄 Recarregar posições

    </button>

  </div>

  <div id="mapaAdministrativo"></div>

  <p id="quantidadeMapaAdmin"></p>

  <div class="acoes">

    <button
      id="salvarMapaAdmin"
      type="button"
      disabled>

      💾 Salvar posições

    </button>

    <button
      id="cancelarMapaAdmin"
      type="button"
      class="secundario">

      Cancelar alterações

    </button>

  </div>

  <p
    id="mensagemMapaAdmin"
    class="mensagem"
    role="status">
  </p>

</div>

<div class="caixa">

  <h2>🐂 Bois disponíveis no mapa</h2>

  <div id="listaMapaAdmin"></div>

</div>

`;

obter("telaPainel").appendChild(secaoMapa);

/* =========================================
   MENSAGENS
========================================= */

function mensagemMapa(texto) {

  obter("mensagemMapaAdmin").textContent =
    texto;

}

/* =========================================
   CONTROLE DOS BOTÕES
========================================= */

function atualizarBotoesMapa() {

  obter("salvarMapaAdmin").disabled =
    salvandoMapa ||
    carregandoMapa ||
    !mapaCarregado ||
    !alteracoesMapa ||
    !marcadoresAdmin.size;

  obter("anoMapaAdmin").disabled =
    salvandoMapa || carregandoMapa;

  obter("cancelarMapaAdmin").disabled =
    salvandoMapa || carregandoMapa;

  obter("recarregarMapaAdmin").disabled =
    salvandoMapa || carregandoMapa;

}

/* =========================================
   CRIAR MAPA
========================================= */

function iniciarMapaAdmin() {

  if (mapaAdmin) {

    mapaAdmin.invalidateSize();

    return;

  }

  mapaAdmin = L.map(
    "mapaAdministrativo",
    {
      scrollWheelZoom: true
    }
  ).setView(
    CENTRO_ADMIN,
    ZOOM_ADMIN
  );

  const tradicional = L.tileLayer(

    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",

    {
      maxZoom: 19,

      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }

  ).addTo(mapaAdmin);

  const colorido = L.tileLayer(

    "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",

    {
      maxZoom: 19,

      attribution:
        "&copy; OpenStreetMap contributors &copy; CARTO"
    }

  );

  L.control.layers({

    "Mapa tradicional": tradicional,

    "Mapa colorido": colorido

  }).addTo(mapaAdmin);

  grupoAdmin = L.layerGroup()
    .addTo(mapaAdmin);

}

/* =========================================
   ÍCONE PERSONALIZADO DO REISADO
========================================= */

function criarIconeAdmin() {

  return L.divIcon({

    className: "icone-admin-boi",

    html:
      '<img src="icone-boi-reisado.png" alt="">',

    iconSize: [52, 52],

    iconAnchor: [26, 26],

    popupAnchor: [0, -26],

    tooltipAnchor: [0, 30]

  });

}

/* =========================================
   POSIÇÕES INICIAIS ILUSTRATIVAS
========================================= */

function posicaoInicial(indice, total) {

  const anel = Math.floor(indice / 8);

  const quantidade = Math.min(
    8,
    total - anel * 8
  );

  const angulo =

    2 * Math.PI * (indice % 8) /

    Math.max(quantidade, 1) -

    Math.PI / 2;

  const raio = 110 + anel * 95;

  return [

    CENTRO_ADMIN[0] +

    raio * Math.sin(angulo) / 111320,

    CENTRO_ADMIN[1] +

    raio * Math.cos(angulo) /

    (
      111320 *
      Math.cos(
        CENTRO_ADMIN[0] * Math.PI / 180
      )
    )

  ];

}

/* =========================================
   VALIDAR COORDENADAS
========================================= */

function posicaoValida(posicao) {

  return (

    posicao &&

    Number.isFinite(posicao.latitude) &&

    Number.isFinite(posicao.longitude) &&

    Math.abs(posicao.latitude) <= 90 &&

    Math.abs(posicao.longitude) <= 180

  );

}

/* =========================================
   CARREGAR TEMPORADAS
========================================= */

async function carregarAnosMapa() {

  const snapshot = await boisRef.once("value");

  const anos = new Set(["2027"]);

  snapshot.forEach(item => {

    if (

      /^20[2-9][0-9]$/.test(item.key) &&

      Number(item.key) >= 2027

    ) {

      anos.add(item.key);

    }

  });

  const select = obter("anoMapaAdmin");

  const anterior = select.value || temporada;

  select.replaceChildren();

  [...anos]

    .sort((a, b) => Number(b) - Number(a))

    .forEach(ano => {

      select.add(new Option(ano, ano));

    });

  select.value = anos.has(anterior)

    ? anterior

    : "2027";

}

/* =========================================
   CARREGAR BOIS E POSIÇÕES
========================================= */

async function carregarMapaBois() {

  if (salvandoMapa) return;

  if (auth.currentUser?.uid !== ADMIN_UID) {

    mensagemMapa("Acesso não autorizado.");

    return;

  }

  const consulta = ++numeroConsulta;

  const ano = obter("anoMapaAdmin").value;

  carregandoMapa = true;

  mapaCarregado = false;

  atualizarBotoesMapa();

  mensagemMapa("Carregando bois e posições...");

  try {

    const [snapshotBois, snapshotPosicoes] =

      await Promise.all([

        boisRef.child(ano).once("value"),

        posicoesRef.child(ano).once("value")

      ]);

    if (

      consulta !== numeroConsulta ||

      auth.currentUser?.uid !== ADMIN_UID

    ) return;

    const dadosPosicoes =

      snapshotPosicoes.val() || {};

    const lista = [];

    snapshotBois.forEach(item => {

      const b = item.val();

      if (!b || !b.nome) return;

      lista.push({

        id: item.key,

        nome: String(b.nome),

        dono: String(b.dono || ""),

        comunidade: String(b.comunidade || "")

      });

    });

    lista.sort((a, b) =>

      a.nome.localeCompare(b.nome, "pt-BR")

    );

    grupoAdmin.clearLayers();

    marcadoresAdmin.clear();

    obter("listaMapaAdmin").replaceChildren();

    lista.forEach((boi, indice) => {

      const posicao = dadosPosicoes[boi.id];

      const cadastrada = posicaoValida(posicao);

      const coordenadas = cadastrada

        ? [

            posicao.latitude,

            posicao.longitude

          ]

        : posicaoInicial(
            indice,
            lista.length
          );

      criarMarcadorAdmin(

        boi,

        coordenadas,

        cadastrada

      );

    });

    anoCarregado = ano;

    alteracoesMapa = false;

    mapaCarregado = true;

    obter("quantidadeMapaAdmin").textContent =

      lista.length +

      " bois cadastrados na temporada " +

      ano;

    mapaAdmin.setView(

      CENTRO_ADMIN,

      ZOOM_ADMIN

    );

    mapaAdmin.invalidateSize();

    mensagemMapa(

      lista.length

        ? "Arraste os bois para alterar suas posições."

        : "Nenhum boi cadastrado nesta temporada."

    );

  } catch (erro) {

    if (consulta !== numeroConsulta) return;

    mensagemMapa(

      "Erro ao carregar o mapa: " +

      erro.message

    );

  } finally {

    if (consulta === numeroConsulta) {

      carregandoMapa = false;

      atualizarBotoesMapa();

    }

  }

}

/* =========================================
   CRIAR MARCADOR ARRASTÁVEL
========================================= */

function criarMarcadorAdmin(

  boi,

  coordenadas,

  cadastrada

) {

  const marcador = L.marker(

    coordenadas,

    {

      icon: criarIconeAdmin(),

      draggable: true,

      autoPan: true,

      title: boi.nome

    }

  ).addTo(grupoAdmin);

  /* NOME E PROPRIETÁRIO */

  const rotulo = document.createElement("div");

  const nome = document.createElement("strong");

  nome.textContent = boi.nome;

  const dono = document.createElement("div");

  dono.textContent = boi.dono;

  rotulo.append(nome, dono);

  marcador.bindTooltip(rotulo, {

    permanent: true,

    direction: "bottom",

    className: "rotulo-admin-boi",

    opacity: 1

  });

  /* INFORMAÇÕES DO BOI */

  const popup = document.createElement("div");

  [

    boi.nome,

    "Proprietário: " + boi.dono,

    "Localidade: " + boi.comunidade,

    "Arraste o ícone para posicionar."

  ].forEach(texto => {

    const linha = document.createElement("p");

    linha.textContent = texto;

    popup.appendChild(linha);

  });

  marcador.bindPopup(popup);

  /* GUARDAR MARCADOR */

  const registro = {

    boi: boi,

    marcador: marcador,

    alterado: false

  };

  marcadoresAdmin.set(boi.id, registro);

  /* LISTA DOS BOIS */

  const card = document.createElement("div");

  card.className = "item";

  const titulo = document.createElement("h3");

  titulo.textContent = "🐂 " + boi.nome;

  const proprietario = document.createElement("p");

  proprietario.textContent =

    "Proprietário: " + boi.dono;

  const situacao = document.createElement("p");

  situacao.textContent = cadastrada

    ? "📍 Posição cadastrada"

    : "⚠️ Posição ilustrativa";

  const botaoLocalizar =

    document.createElement("button");

  botaoLocalizar.type = "button";

  botaoLocalizar.textContent = "Ver no mapa";

  botaoLocalizar.onclick = () => {

    mapaAdmin.setView(

      marcador.getLatLng(),

      18

    );

    marcador.openPopup();

    obter("mapaAdministrativo").scrollIntoView({

      behavior: "smooth"

    });

  };

  card.append(

    titulo,

    proprietario,

    situacao,

    botaoLocalizar

  );

  obter("listaMapaAdmin").appendChild(card);

  registro.situacao = situacao;

  /* QUANDO O BOI FOR ARRASTADO */

  marcador.on("dragstart", () => {

    marcador.closePopup();

  });

  marcador.on("dragend", () => {

    if (salvandoMapa) return;

    registro.alterado = true;

    alteracoesMapa = true;

    const p = marcador.getLatLng();

    situacao.textContent =

      "🟡 Posição alterada. Aguardando salvar.";

    mensagemMapa(

      boi.nome +

      " foi reposicionado. " +

      "Clique em Salvar posições."

    );

    atualizarBotoesMapa();

  });

}

/* =========================================
   SALVAR POSIÇÕES NO FIREBASE
========================================= */

async function salvarPosicoesMapa() {

  if (

    salvandoMapa ||

    carregandoMapa ||

    !mapaCarregado ||

    !alteracoesMapa

  ) return;

  if (auth.currentUser?.uid !== ADMIN_UID) {

    mensagemMapa("Acesso não autorizado.");

    return;

  }

  const ano = anoCarregado;

  const atualizacoes = {};

  marcadoresAdmin.forEach((registro, id) => {

    if (!registro.alterado) return;

    const p = registro.marcador.getLatLng();

    atualizacoes[id] = {

      latitude: Number(p.lat.toFixed(7)),

      longitude: Number(p.lng.toFixed(7))

    };

  });

  if (!Object.keys(atualizacoes).length) return;

  salvandoMapa = true;

  atualizarBotoesMapa();

  marcadoresAdmin.forEach(registro => {

    registro.marcador.dragging.disable();

  });

  mensagemMapa("Salvando posições...");

  try {

    await posicoesRef

      .child(ano)

      .update(atualizacoes);

    marcadoresAdmin.forEach(registro => {

      if (registro.alterado) {

        registro.situacao.textContent =

          "📍 Posição cadastrada";

      }

      registro.alterado = false;

    });

    alteracoesMapa = false;

    mensagemMapa(

      "✅ Posições salvas com sucesso! " +

      "O mapa público foi atualizado."

    );

  } catch (erro) {

    mensagemMapa(

      "Erro ao salvar: " +

      erro.message

    );

  } finally {

    salvandoMapa = false;

    marcadoresAdmin.forEach(registro => {

      registro.marcador.dragging.enable();

    });

    atualizarBotoesMapa();

  }

}

/* =========================================
   ABRIR A NOVA ABA
========================================= */

abaMapa.onclick = async () => {

  if (auth.currentUser?.uid !== ADMIN_UID) return;

  document

    .querySelectorAll("#telaPainel > section")

    .forEach(secao => {

      secao.classList.add("oculto");

    });

  document

    .querySelectorAll("[data-aba]")

    .forEach(botao => {

      botao.classList.remove("ativo");

    });

  abaMapa.classList.add("ativo");

  secaoMapa.classList.remove("oculto");

  try {

    iniciarMapaAdmin();

    if (

      alteracoesMapa ||

      salvandoMapa ||

      carregandoMapa

    ) {

      mapaAdmin.invalidateSize();

      return;

    }

    await carregarAnosMapa();

    await carregarMapaBois();

  } catch (erro) {

    mensagemMapa(erro.message);

  }

  setTimeout(() => {

    mapaAdmin?.invalidateSize();

  }, 200);

};

/* =========================================
   INTEGRAÇÃO COM AS ABAS EXISTENTES
========================================= */

document.querySelectorAll("[data-aba]")

  .forEach(botao => {

    if (botao === abaMapa) return;

    botao.addEventListener("click", () => {

      secaoMapa.classList.add("oculto");

      abaMapa.classList.remove("ativo");

    });

  });

/* =========================================
   TROCAR TEMPORADA
========================================= */

obter("anoMapaAdmin").onchange = () => {

  if (

    alteracoesMapa &&

    !confirm(

      "Existem posições não salvas. " +

      "Deseja descartar as alterações?"

    )

  ) {

    obter("anoMapaAdmin").value = anoCarregado;

    return;

  }

  carregarMapaBois();

};

/* =========================================
   CENTRALIZAR MAPA
========================================= */

obter("centralizarMapaAdmin").onclick = () => {

  mapaAdmin?.setView(

    CENTRO_ADMIN,

    ZOOM_ADMIN

  );

};

/* =========================================
   BOTÃO SALVAR
========================================= */

obter("salvarMapaAdmin").onclick =

  salvarPosicoesMapa;

/* =========================================
   CANCELAR ALTERAÇÕES
========================================= */

function recarregarPosicoes() {

  if (salvandoMapa || carregandoMapa) return;

  if (

    alteracoesMapa &&

    !confirm("Descartar as posições não salvas?")

  ) return;

  carregarMapaBois();

}

obter("cancelarMapaAdmin").onclick =

  recarregarPosicoes;

obter("recarregarMapaAdmin").onclick =

  recarregarPosicoes;

/* =========================================
   LIMPAR MAPA AO SAIR DA CONTA
========================================= */

auth.onAuthStateChanged(usuario => {

  if (usuario?.uid === ADMIN_UID) return;

  numeroConsulta++;

  alteracoesMapa = false;

  mapaCarregado = false;

  carregandoMapa = false;

  anoCarregado = null;

  grupoAdmin?.clearLayers();

  marcadoresAdmin.clear();

  obter("listaMapaAdmin").replaceChildren();

  secaoMapa.classList.add("oculto");

  mostrarAba("bois");

  atualizarBotoesMapa();

});

/* =========================================
   EVITAR PERDA DE ALTERAÇÕES
========================================= */

window.addEventListener("beforeunload", e => {

  if (alteracoesMapa || salvandoMapa) {

    e.preventDefault();

    e.returnValue = "";

  }

});

})();

</script>

<!-- FIM DO MAPA ADMINISTRATIVO -->
